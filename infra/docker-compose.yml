services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api-go
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    restart: unless-stopped

  agent-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.agent-go
    ports:
      - "3334:3334"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    volumes:
      - claude_home:/home/agent/.claude   # credenciais OAuth + sessões .jsonl (--resume)
      - claude_workspaces:/data/workspaces # checkouts dos repositórios
    restart: unless-stopped

  mcp-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp-go
    ports:
      - "3335:3335"
    env_file:
      - ../.env
    environment:
      # No stack local fala com os serviços vizinhos, não com produção.
      AUTH_API_URL: http://api:3000
      CLAUDE_API_URL: http://agent-go:3334
    depends_on:
      - api
      - agent-go
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: santos_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  claude_home:
  claude_workspaces:
