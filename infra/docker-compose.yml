# Stack de DEV. Em produção, Postgres/Redis são gerenciados pela Coolify.
# As senhas locais vêm de variáveis de ambiente com defaults só-para-dev.
# Postgres/Redis NÃO publicam portas no host: os apps falam com eles pela
# rede interna do compose (hostnames `postgres` e `redis`).
x-db-env: &db-env
  # Sobrescreve DATABASE_URL/REDIS_URL do .env para apontar pra rede interna do compose,
  # mantendo consistência com as senhas dos serviços postgres/redis abaixo.
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/santos_tech?sslmode=disable
  REDIS_URL: redis://default:${REDIS_PASSWORD:-dev_only_change_me}@redis:6379

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api-go
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *db-env
    restart: unless-stopped

  agent-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.agent-go
    ports:
      - "3334:3334"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *db-env
    volumes:
      - claude_home:/home/agent/.claude   # credenciais OAuth + sessões .jsonl (--resume)
      - claude_workspaces:/data/workspaces # checkouts dos repositórios
    restart: unless-stopped

  mcp-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp-go
    ports:
      - "3335:3335"
    env_file:
      - ../.env
    environment:
      # No stack local fala com os serviços vizinhos, não com produção.
      AUTH_API_URL: http://api:3000
      CLAUDE_API_URL: http://agent-go:3334
    depends_on:
      - api
      - agent-go
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: santos_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem `ports:` — acessível apenas via rede interna do compose (hostname `postgres`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev_only_change_me}"]
    # Sem `ports:` — acessível apenas via rede interna do compose (hostname `redis`).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_only_change_me}

volumes:
  postgres_data:
  claude_home:
  claude_workspaces:
