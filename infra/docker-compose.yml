# Stack de DEV. Em produção, Postgres/Redis são gerenciados pela Coolify.
# As senhas locais vêm de variáveis de ambiente com defaults só-para-dev.
# Postgres/Redis NÃO publicam portas no host: os apps falam com eles pela
# rede interna do compose (hostnames `postgres` e `redis`).
x-db-env: &db-env
  # Sobrescreve DATABASE_URL/REDIS_URL do .env para apontar pra rede interna do compose,
  # mantendo consistência com as senhas dos serviços postgres/redis abaixo.
  #
  # TOPOLOGIA DE DEV: as apps Go falam com o Postgres ATRAVÉS do PgBouncer
  # (host `pgbouncer:6432`, mesmo banco/credenciais). O PgBouncer roda em
  # TRANSACTION mode, então prepared statements no lado servidor não são
  # suportados — por isso `DB_PREPARED_STATEMENTS=false`.
  # EM PRODUÇÃO (Coolify) o PgBouncer é provisionado na infra e o DATABASE_URL
  # já aponta para ele; este override é exclusivo do compose de DEV.
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-dev_only_change_me}@pgbouncer:6432/santos_tech?sslmode=disable
  DB_PREPARED_STATEMENTS: "false"
  REDIS_URL: redis://default:${REDIS_PASSWORD:-dev_only_change_me}@redis:6379

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api-go
    ports:
      - "3000:3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *db-env
      # api-go usa default 3333; fixamos 3000 para casar com o mapeamento/healthcheck
      # mesmo que ../.env não defina PORT.
      PORT: "3000"
    # Imagem distroless :debug traz o wget do busybox (em /busybox).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  payments-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.payments-go
    ports:
      - "3336:3336"
    depends_on:
      pgbouncer:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *db-env
      PORT: "3336"
      DOTFY_BASE_URL: ${DOTFY_BASE_URL:-https://app.dotfy.com.br}
    # Imagem distroless :debug traz o wget do busybox (em /busybox).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3336/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cron-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.cron-go
    ports:
      - "3337:3337"
    depends_on:
      pgbouncer:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *db-env
      PORT: "3337"
      AUTH_ME_URL: http://api:3000/auth/me
    # Imagem distroless :debug traz o wget do busybox (em /busybox).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3337/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.agent-go
    ports:
      - "3334:3334"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *db-env
    volumes:
      - claude_home:/home/agent/.claude   # credenciais OAuth + sessões .jsonl (--resume)
      - claude_workspaces:/data/workspaces # checkouts dos repositórios
    # Imagem node:bookworm-slim já traz curl; rota de health é /claude/health.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3334/claude/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mcp-go:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp-go
    ports:
      - "3335:3335"
    env_file:
      - ../.env
    environment:
      # No stack local fala com os serviços vizinhos, não com produção.
      AUTH_API_URL: http://api:3000
      CLAUDE_API_URL: http://agent-go:3334
    depends_on:
      api:
        condition: service_healthy
      agent-go:
        condition: service_healthy
    # Imagem distroless :debug traz o wget do busybox (em /busybox).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3335/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: santos_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem `ports:` — acessível apenas via rede interna do compose (hostname `postgres`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer em TRANSACTION mode na frente do Postgres — TOPOLOGIA DE DEV.
  # As apps Go (api, agent-go, payments-go, bot-go) conectam aqui (pgbouncer:6432)
  # em vez de direto no Postgres. Em produção (Coolify) o PgBouncer é provisionado
  # na infra e o DATABASE_URL das apps já aponta para ele — este serviço existe só
  # para reproduzir a mesma topologia localmente.
  # NB: transaction mode não suporta prepared statements server-side; as apps usam
  # DB_PREPARED_STATEMENTS=false (ver x-db-env acima).
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p2
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: santos_tech
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POOL_MODE: transaction
      # md5 evita depender de SCRAM/handshake especial entre app→pgbouncer no dev.
      AUTH_TYPE: md5
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      # Usado só pelo healthcheck (psql -h 127.0.0.1 contra a base admin do pgbouncer).
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem edoburu/pgbouncer traz psql; consulta a pseudo-base de admin do pgbouncer.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 6432 -U postgres -d pgbouncer -tAc 'SHOW LISTS;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # --appendonly yes liga a persistência AOF (gravada no volume redis_data:/data).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev_only_change_me}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # Sem `ports:` — acessível apenas via rede interna do compose (hostname `redis`).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_only_change_me}

volumes:
  postgres_data:
  redis_data:
  claude_home:
  claude_workspaces:
