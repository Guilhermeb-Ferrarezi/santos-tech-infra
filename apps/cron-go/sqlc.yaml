version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema.sql"
    queries: "db/query"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # JSONB como json.RawMessage → serializa como JSON cru na resposta
          # (sem isso, []byte vira base64 no JSON, sujando o contrato da API).
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
