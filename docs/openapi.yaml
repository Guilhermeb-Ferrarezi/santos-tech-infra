      responses:
        "200":
          description: Página de posts publicados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BlogPostSummaryPublic" } }
                  page: { type: integer }
                  pageSize: { type: integer }
