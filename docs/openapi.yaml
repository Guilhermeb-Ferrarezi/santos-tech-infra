            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/timeseries:
    get:
      tags: [Observabilidade]
      summary: Pageviews por dia (série temporal) via PostHog
      description: Admin-only. Responde 503 se PostHog não configurado.
      parameters:
        - { in: query, name: range, description: "7d (default) | 30d | 90d", schema: { type: string } }
      responses:
        "200":
          description: Pontos diários, em ordem cronológica.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostHogTimeseriesPoint" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: POSTHOG_PERSONAL_API_KEY não configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/top-pages:
    get:
      tags: [Observabilidade]
      summary: Ranking de páginas ($pathname) por pageviews via PostHog
      description: Admin-only. Top 20. Responde 503 se PostHog não configurado.
      parameters:
        - { in: query, name: range, description: "7d (default) | 30d | 90d", schema: { type: string } }
      responses:
        "200":
          description: Ranking de páginas, mais vistas primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostHogCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: POSTHOG_PERSONAL_API_KEY não configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/referrers:
    get:
      tags: [Observabilidade]
      summary: Ranking de origem do tráfego (domínio de referrer) via PostHog
      description: |
        Admin-only. Top 20. Visitas sem referrer (URL digitada, app nativo) vêm
        rotuladas "Direto". Responde 503 se PostHog não configurado.
      parameters:
        - { in: query, name: range, description: "7d (default) | 30d | 90d", schema: { type: string } }
      responses:
        "200":
          description: Ranking de referrers, mais frequentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostHogCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: POSTHOG_PERSONAL_API_KEY não configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/by-site:
    get:
      tags: [Observabilidade]
      summary: Compara pageviews entre os 3 sites do ecossistema via PostHog
      description: |
        Admin-only. Os 3 sites (Site principal, Blog, Dashboard) mandam evento
        pro mesmo projeto PostHog, distinguidos pelo prefixo do path (mesmo
        $host, santos-tech.com). Responde 503 se PostHog não configurado.
      parameters:
        - { in: query, name: range, description: "7d (default) | 30d | 90d", schema: { type: string } }
      responses:
        "200":
          description: Um item por site, mais visto primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostHogCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: POSTHOG_PERSONAL_API_KEY não configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /hour-clients:
    get:
      tags: [Horas]
      summary: Lista clientes do controle de horas
      description: Admin-only.
      responses:
        "200":
          description: Clientes cadastrados, ordenados por nome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients: { type: array, items: { $ref: "#/components/schemas/HourClient" } }
                required: [clients]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Horas]
      summary: Cadastra cliente
      description: Admin-only. Rate limit 20/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                phone: { type: string, nullable: true }
              required: [name]
      responses:
        "201":
          description: Cliente criado, com saldo zerado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/HourClient" }
                required: [client]
        "400":
          description: Nome ausente ou grande demais.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-clients/{id}:
    patch:
      tags: [Horas]
      summary: Ajusta o desconto padrão do cliente
      description: |
        Admin-only. `discountPercent` (0-100) é o desconto padrão aplicado no
        faturamento avulso deste cliente (ver GET /hour-billing) — não é um
        desconto por sessão, é o percentual usado sempre que esse cliente
        aparece no relatório. Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discountPercent: { type: integer, minimum: 0, maximum: 100 }
              required: [discountPercent]
      responses:
        "200":
          description: Cliente com o desconto atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/HourClient" }
                required: [client]
        "400":
          description: discountPercent fora de 0-100.
        "404":
          description: Cliente não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-billing:
    get:
      tags: [Horas]
      summary: Relatório de faturamento avulso, agregado por cliente
      description: |
        Admin-only. Soma `billableMinutes` (tempo que passou do saldo
        pré-pago — cliente com pacote suficiente não gera nada aqui) de todas
        as sessões encerradas de cada cliente no período `[from, to)`, e
        converte pro valor a cobrar (bruto e líquido com o desconto padrão do
        cliente) à razão de R$20/h. Só clientes com algum tempo avulso no
        período aparecem. Sem `from`/`to`: últimos 30 dias.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Linhas de faturamento por cliente, ordenadas por tempo avulso decrescente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        clientId: { type: string, format: uuid }
                        clientName: { type: string }
                        billableMinutes: { type: integer, description: "Minutos avulsos (sem saldo pré-pago) no período." }
                        discountPercent: { type: integer }
                        ratePerHourCents: { type: integer, description: "Preço da hora avulsa em centavos (constante de negócio)." }
                        grossCents: { type: integer, description: "billableMinutes convertido em R$, sem desconto." }
                        netCents: { type: integer, description: "grossCents com discountPercent aplicado — valor a cobrar." }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                required: [rows, from, to]
        "400":
          description: from/to inválidos, ou to não é depois de from.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-clients/{id}/purchases:
    post:
      tags: [Horas]
      summary: Registra compra de pacote de horas
      description: |
        Admin-only. Credita `minutesAdded` no saldo do cliente e grava o registro
        de auditoria (quem, quando, nota). Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutesAdded: { type: integer, description: "Minutos a creditar (não pode ser zero)." }
                note: { type: string, nullable: true }
              required: [minutesAdded]
      responses:
        "200":
          description: Cliente com saldo atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/HourClient" }
                required: [client]
        "404":
          description: Cliente não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions:
    get:
      tags: [Horas]
      summary: Lista sessões ao vivo (painel admin)
      description: Admin-only. Só sessões ainda não encerradas, com `elapsedSeconds` já calculado a partir do histórico de eventos.
      responses:
        "200":
          description: Sessões ativas/pausadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/HourSession" } }
                required: [sessions]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Horas]
      summary: Inicia sessão para um cliente
      description: |
        Admin-only. Gera o token do link público E um código curto de 6 dígitos
        (alternativa a colar o link no PC — expira em 24h, uso único; ver
        `POST /public/hour-sessions/pair-by-code`). Ambos devolvidos em texto
        puro só nesta resposta — o banco guarda apenas o hash do token (e o
        próprio código, zerado no primeiro pareamento). Rate limit 30/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string, format: uuid }
                scheduledEndAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: |
                    Opcional — timestamp absoluto (RFC3339) em que a sessão encerra
                    sozinha (mesmo efeito de POST /hour-sessions/{id}/end, autor =
                    quem criou). Front resolve duração OU horário fixo pra esse
                    timestamp antes de mandar. Omitido/null = duração livre, até o
                    admin encerrar (comportamento padrão). Precisa ser no futuro.
                scheduledStartAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: |
                    Opcional — timestamp absoluto (RFC3339) em que a sessão inicia
                    sozinha. Se futuro, a sessão nasce com status `scheduled` (sem
                    evento start, elapsedSeconds=0, cliente não consegue usar ainda)
                    e vira `active` sozinha ao chegar nesse horário. Omitido = começa
                    agora, elapsedSeconds=0. PASSADO = início retroativo: a sessão
                    nasce `active` direto, mas o evento start é backdatado pra esse
                    horário — elapsedSeconds já vem maior que zero (admin esqueceu de
                    abrir a sessão e o cliente já tinha começado). Se os dois campos
                    forem dados, scheduledEndAt precisa ser depois de scheduledStartAt.
              required: [clientId]
      responses:
        "201":
          description: Sessão criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/HourSession" }
                  token: { type: string, description: "64 chars hex — só aparece nesta resposta." }
                  publicUrl: { type: string }
                  shortCode: { type: string, description: "6 dígitos — só aparece nesta resposta. Expira em 24h, uso único." }
                required: [session, token, publicUrl, shortCode]
        "400":
          description: clientId inválido.
        "404":
          description: Cliente não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/pause:
    post:
      tags: [Horas]
      summary: Pausa sessão (admin)
      description: Admin-only. Só permitido a partir do estado `active`. Limpa um eventual pedido de pausa pendente do cliente.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessão pausada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/HourSession" }
        "404":
          description: Sessão não encontrada.
        "409":
          description: Sessão não está em estado `active`.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/resume:
    post:
      tags: [Horas]
      summary: Retoma sessão pausada (admin)
      description: Admin-only. Só permitido a partir do estado `paused`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessão retomada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/HourSession" }
        "404":
          description: Sessão não encontrada.
        "409":
          description: Sessão não está em estado `paused`.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/end:
    post:
      tags: [Horas]
      summary: Encerra sessão (admin)
      description: |
        Admin-only. Debita do saldo do cliente o tempo decorrido (calculado a
        partir dos eventos, nunca de um contador acumulado). Saldo pode ficar
        negativo — sem corte automático nesta versão.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/HourSession" }
        "404":
          description: Sessão não encontrada.
        "409":
          description: Sessão já estava encerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/deny-pause:
    post:
      tags: [Horas]
      summary: Recusa o pedido de pausa do cliente (admin)
      description: Admin-only. Limpa `pauseRequestedAt` sem alterar o status da sessão.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Pedido recusado.
        "404":
          description: Sessão não encontrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/events:
    get:
      tags: [Horas]
      summary: Histórico da sessão (pausas, retomadas e ajustes)
      description: |
        Admin-only. Ordem cronológica. start/pause/resume/end sempre foram
        gravados com autor e horário; `adjust` são as correções manuais de
        tempo, com `deltaSeconds` e o motivo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Eventos da sessão.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        eventType: { type: string, enum: [start, pause, resume, end, adjust] }
                        deltaSeconds: { type: integer, description: "Só em adjust: positivo soma, negativo desconta." }
                        note: { type: string, nullable: true }
                        actorName: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
        "404":
          description: Sessão não encontrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/adjust:
    post:
      tags: [Horas]
      summary: Corrige manualmente o tempo da sessão
      description: |
        Admin-only. Rate limit 30/min. Para quando o tempo não bate com o real
        (esqueceu de pausar, o PC caiu, o cliente saiu antes).

        Entra como **evento** no histórico, não como acerto num total: o tempo
        da sessão continua derivado dos eventos, e a correção fica visível com
        autor, horário e motivo. Um desconto maior que o tempo corrido não gera
        tempo negativo — o piso é zero.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deltaSeconds:
                  type: integer
                  minimum: -86400
                  maximum: 86400
                  description: "Positivo soma, negativo desconta. Zero é recusado."
                note: { type: string, maxLength: 200 }
              required: [deltaSeconds]
      responses:
        "200":
          description: Sessão com o tempo já recalculado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/HourSession" }
        "400":
          description: Ajuste zero ou fora de ±24h (ADJUST_TOO_LARGE).
        "404":
          description: Sessão não encontrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-sessions/{id}/link:
    post:
      tags: [Horas]
      summary: Gera (ou reemite) o link público da sessão
      description: |
        Admin-only. Não depende de cache local — cobre sessão iniciada antes do
        link ter sido copiado, iniciada noutro navegador/dispositivo, ou com o
        link perdido. Gera um token novo; o token anterior (se houver) para de
        funcionar. Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Novo link gerado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "64 chars hex — só aparece nesta resposta." }
                  publicUrl: { type: string }
                required: [token, publicUrl]
        "404":
          description: Sessão não encontrada ou já encerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /public/hour-sessions/{token}:
    get:
      tags: [Horas]
      summary: Consulta a sessão pelo link público (sem autenticação)
      description: |
        Sem cookie/token de sessão — o token na URL é a própria credencial (posse).
        Usado pela rota `/sessao/:token` do dashboard/web, com polling do cliente.
        Rate limit 120/min por IP.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, description: "64 chars hex" }
      responses:
        "200":
          description: Estado atual da sessão.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientName: { type: string }
                  status: { type: string, enum: [scheduled, active, paused, ended], description: "scheduled = início agendado ainda não chegou (ver scheduledStartAt); cronômetro não corre." }
                  scheduledStartAt: { type: string, format: date-time, nullable: true, description: "Preenchido quando status é scheduled — horário em que inicia sozinha." }
                  elapsedSeconds: { type: integer }
                  remainingMinutes: { type: integer, description: "Saldo do cliente menos o tempo decorrido nesta sessão; pode ser negativo." }
                  pauseRequested: { type: boolean }
                required: [clientName, status, elapsedSeconds, remainingMinutes, pauseRequested]
        "404":
          description: Token inválido ou sessão inexistente.
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/hour-sessions/{token}/request-pause:
    post:
      tags: [Horas]
      summary: Cliente solicita pausa (sem autenticação)
      description: |
        Só marca o pedido — quem decide pausar de fato é o admin
        (`POST /hour-sessions/{id}/pause`). Rate limit apertado (5/min por IP) pra
        não virar canal de spam de notificação pro admin.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, description: "64 chars hex" }
      responses:
        "204":
          description: Pedido registrado.
        "404":
          description: Token inválido ou sessão inexistente.
        "409":
          description: Sessão não está ativa ou já tem pedido pendente.
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/hour-sessions/pair-by-code:
    post:
      tags: [Horas]
      summary: Troca um código curto por um token de sessão (sem autenticação)
      description: |
        Alternativa a colar o link de 64 chars no PC do laboratório: digita-se
        só os 6 dígitos. Devolve um token REEMITIDO (nunca o token original,
        que não fica guardado em texto puro) e zera o código — uso único,
        mesmo que ainda não tivesse expirado (24h). Rate limit 15/min por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: "6 dígitos" }
              required: [code]
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  publicUrl: { type: string }
                required: [token, publicUrl]
        "404":
          description: Código inválido ou expirado.
        "429":
          $ref: "#/components/responses/RateLimited"

  /hour-lab-devices:
    get:
      tags: [Horas]
      summary: Lista os PCs do laboratório (hour-timer-app) já vistos
      description: |
        Admin-only. Cada PC aparece depois do primeiro heartbeat. "Online/offline"
        não é um campo — decida no cliente a partir de `lastSeenAt` (heartbeat a
        cada ~30s; recomendado considerar offline acima de ~90s sem heartbeat).
      responses:
        "200":
          description: Lista de dispositivos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/LabDevice" } }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/pair:
    post:
      tags: [Horas]
      summary: Pareia um PC via QR — inicia sessão e entrega o token no heartbeat seguinte
      description: |
        Admin-only. Fluxo do QR: o PC (ainda sem sessão) mostra um QR com o
        próprio `deviceUuid`; o admin escaneia com o celular (já autenticado),
        abre `/admin/horas/parear/:deviceUuid` no dashboard e escolhe o
        cliente — chamando este endpoint. Inicia a sessão (mesma lógica de
        `POST /hour-sessions`) e deixa o token pronto pra entrega automática
        no próximo heartbeat do PC (`pending_pair_token`, mesmo padrão de
        entrega única de `unpairRequested`/`message`) — nada é digitado no
        PC. Rate limit 30/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceUuid: { type: string, format: uuid }
                clientId: { type: string, format: uuid }
              required: [deviceUuid, clientId]
      responses:
        "200":
          description: Sessão criada e token preparado pro dispositivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/HourSession" }
        "400":
          description: deviceUuid/clientId inválido.
        "404":
          description: Cliente ou dispositivo não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}:
    patch:
      tags: [Horas]
      summary: Renomeia um PC do laboratório
      description: |
        Admin-only. Nome é sempre atribuído pelo admin, nunca pelo próprio app —
        evita bagunça de nomes dados por quem estiver sentado no PC. Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
              required: [name]
      responses:
        "200":
          description: Dispositivo renomeado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/LabDevice" }
        "400":
          description: Nome vazio ou maior que 80 caracteres.
        "404":
          description: Dispositivo não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Horas]
      summary: Remove o registro de um PC do laboratório
      description: |
        Admin-only. Remove a linha (nome, histórico de heartbeat) — não afeta
        nenhuma sessão que o PC já rodou. Se o mesmo PC mandar heartbeat de
        novo depois, a linha é recriada do zero. Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Dispositivo removido.
        "404":
          description: Dispositivo não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}/unpair:
    post:
      tags: [Horas]
      summary: Força o PC a voltar pra tela de colar link
      description: |
        Admin-only. Não afeta a sessão em si (pausar/encerrar é
        `/hour-sessions/{id}/...`), só solta o pareamento local do PC — entregue
        no heartbeat seguinte (até ~30s de atraso). Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Comando registrado.
        "404":
          description: Dispositivo não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}/message:
    post:
      tags: [Horas]
      summary: Manda um aviso pra aparecer na tela do PC
      description: |
        Admin-only. Entregue no heartbeat seguinte (até ~30s de atraso); o app
        deduplica pelo id da mensagem, então enviar o mesmo texto de novo exibe
        de novo. Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 300 }
              required: [text]
      responses:
        "204":
          description: Aviso registrado.
        "400":
          description: Texto vazio ou maior que 300 caracteres.
        "404":
          description: Dispositivo não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /public/lab-devices/heartbeat:
    post:
      tags: [Horas]
      summary: Heartbeat periódico do app desktop (sem autenticação)
      description: |
        Sem login — `deviceId` (UUID gerado e persistido localmente no primeiro
        boot do app) é a própria identidade. Enviado a cada ~30s pelo
        hour-timer-app; devolve o nome atribuído pelo admin e os comandos
        pendentes (despairar / aviso / token de pareamento via QR), entregues
        exatamente uma vez. Rate limit 120/min por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string, format: uuid }
                token: { type: string, description: "Token da sessão pareada localmente, se houver (64 chars hex)." , nullable: true }
                appVersion: { type: string, maxLength: 50 }
                previousDeviceId:
                  type: string
                  format: uuid
                  description: >
                    Identidade anterior do PC (app 0.1.10+), enviada quando o app passa a
                    derivar o id do MachineGuid do Windows. O servidor MOVE o registro
                    antigo (nome, sessão, inventário, capturas) para a identidade nova.
                    Registro que já tem segredo exige o deviceSecret antigo como prova de
                    posse; registro ainda sem segredo migra livre, pela mesma política de
                    adoção aberta do primeiro heartbeat (necessário pro upgrade dos PCs em
                    0.1.0, anteriores ao segredo existir). Se a identidade nova já tiver
                    registro próprio, nada é movido. O app (0.1.11+) reenvia este campo em
                    todo heartbeat até a resposta trazer previousDeviceResolved — um envio
                    único que chegue na hora errada deixaria um dispositivo duplicado sem
                    chance de retomada.
                openApps:
                  type: array
                  maxItems: 100
                  items: { type: string, maxLength: 100 }
                  description: >
                    Nomes dos aplicativos abertos neste instante (app 0.1.9+). Substituem a
                    lista anterior. Ausente ≠ vazio: campo omitido mantém a última lista
                    conhecida (app antigo), enquanto [] significa "nada aberto". Só nomes —
                    título de janela carregaria conteúdo e fica de fora de propósito.
                sshPublicKey:
                  type: string
                  maxLength: 2048
                  description: >
                    Chave pública SSH (formato de linha do authorized_keys) gerada
                    localmente pela máquina e enviada só no primeiro heartbeat — nunca a
                    privada, que fica só na máquina. String vazia nos heartbeats
                    seguintes mantém a chave já registrada em vez de apagar. Visível no
                    LabDevice da listagem admin (GET /hour-lab-devices) pra alguém do
                    time conseguir dar ssh sem procurar a chave manualmente.
              required: [deviceId]
      responses:
        "200":
          description: Nome atual e comandos pendentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, nullable: true }
                  unpairRequested: { type: boolean }
                  message:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      text: { type: string }
                  pairToken: { type: string, description: "Token pronto pra uso (pareamento via QR concluído pelo admin) — entregue uma única vez." }
                  screenshotRequested: { type: boolean, description: "O admin pediu uma captura de tela — entregue uma única vez." }
                  deviceSecret: { type: string, description: "Credencial deste PC, emitida no ÚNICO heartbeat em que é criada (adoção). O app precisa persistir; sem ela os heartbeats seguintes levam 401." }
                  previousDeviceResolved:
                    type: boolean
                    description: >
                      Não sobrou nada a migrar do previousDeviceId (moveu agora, ou o
                      registro antigo já não existe). Só então o app esquece o id antigo;
                      enquanto não vier, ele reenvia previousDeviceId a cada heartbeat e a
                      migração acontece sozinha quando o impedimento sair do caminho —
                      admin esquece o segredo do registro antigo, ou apaga o duplicado.
                required: [name, unpairRequested]
        "400":
          description: deviceId inválido.
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/lab-devices/inventory:
    post:
      tags: [Horas]
      summary: Inventário de software do PC (sem login, autenticado pelo segredo do dispositivo)
      description: |
        O app lê a lista de programas instalados do registro do Windows (a mesma
        que aparece em "Adicionar ou remover programas") e manda inteira; o
        servidor substitui o inventário anterior — é uma foto do estado atual,
        não histórico. Enviado depois de um heartbeat bem-sucedido, só quando a
        lista muda ou passa um dia.

        Exige o mesmo `deviceSecret` do heartbeat e, diferente dele, **não**
        adota dispositivo novo: inventário de um `deviceId` que nunca bateu
        heartbeat é recusado. Rate limit 10/min por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string, format: uuid }
                deviceSecret: { type: string, description: "Segredo emitido no primeiro heartbeat (64 chars hex)." }
                programs:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      name: { type: string, maxLength: 200 }
                      version: { type: string, maxLength: 200 }
                      publisher: { type: string, maxLength: 200 }
                      iconHash:
                        type: string
                        pattern: "^[0-9a-f]{64}$"
                        description: >
                          sha256 do PNG do ícone. Os bytes NÃO vão aqui: a mesma imagem
                          vale para todos os PCs, então sobe uma vez só em
                          POST /public/lab-devices/icons. Os hashes que o servidor ainda
                          não conhece voltam em missingIcons.
                      icon:
                        type: string
                        maxLength: 44000
                        description: >
                          Formato do app 0.1.5 (PNG em base64 na própria lista), ainda
                          aceito — o servidor calcula o hash e guarda a imagem.
                    required: [name]
              required: [deviceId]
      responses:
        "200":
          description: >
            Inventário substituído. missingIcons traz os hashes cujas imagens o
            servidor ainda não tem — o app envia só essas em
            POST /public/lab-devices/icons.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  missingIcons:
                    type: array
                    items: { type: string, pattern: "^[0-9a-f]{64}$" }
        "400":
          description: deviceId inválido ou mais de 1000 programas (INVENTORY_TOO_LARGE).
        "401":
          description: Segredo do dispositivo ausente ou inválido (LAB_DEVICE_UNAUTHORIZED).
        "404":
          description: Dispositivo desconhecido (nunca mandou heartbeat).
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/lab-devices/icons:
    post:
      tags: [Horas]
      summary: Envia as imagens de ícone que faltavam no servidor
      description: |
        Segundo passo da coleta: só os hashes que vieram em `missingIcons`. O
        armazenamento é por conteúdo e compartilhado entre todas as máquinas —
        por isso o servidor **recalcula** o sha256 do que recebe e descarta
        quando não bate com o `hash` declarado; sem essa checagem um PC poderia
        gravar qualquer imagem sob o hash de outro programa e trocar o ícone
        para todo mundo.

        Autenticado pelo mesmo `deviceSecret` do heartbeat. Rate limit 10/min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string, format: uuid }
                deviceSecret: { type: string }
                icons:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                      png: { type: string, description: "PNG em base64 puro, até 32 KB decodificados." }
                    required: [hash, png]
              required: [deviceId]
      responses:
        "200":
          description: Quantas imagens foram gravadas (as que não conferiram são ignoradas em silêncio).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  saved: { type: integer }
        "400":
          description: deviceId inválido ou lote acima de 200 ícones (TOO_MANY_ICONS).
        "401":
          description: Segredo do dispositivo ausente ou inválido (LAB_DEVICE_UNAUTHORIZED).
        "429":
          $ref: "#/components/responses/RateLimited"

  /program-icons/{hash}:
    get:
      tags: [Horas]
      summary: PNG do ícone de um programa
      description: |
        Admin-only. A URL é o próprio conteúdo (sha256), então a imagem nunca
        muda: `Cache-Control: public, max-age=31536000, immutable` deixa o
        navegador buscar cada ícone uma única vez, e o JSON do inventário não
        precisa carregar imagem nenhuma.
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Imagem PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Hash desconhecido ou fora do formato (ICON_NOT_FOUND).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}/programs:
    get:
      tags: [Horas]
      summary: Inventário do PC cruzado com os programas esperados
      description: |
        Admin-only. `expected` é o cadastro de `/hour-lab-expected-programs` com
        `installed` resolvido para este PC; `installed` é a lista completa que a
        máquina reportou. `collectedAt` nulo = o PC nunca mandou inventário
        (app anterior à 0.1.2, ou ainda não adotado).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Inventário do PC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collectedAt: { type: string, format: date-time, nullable: true }
                  expected:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        label: { type: string }
                        matchPattern: { type: string }
                        installed: { type: boolean }
                        matchedName: { type: string }
                        matchedVersion: { type: string }
                        matchedIconHash: { type: string, description: "Hash do ícone do programa que casou (ver iconHash)." }
                  installed:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        version: { type: string }
                        publisher: { type: string }
                        iconHash: { type: string, description: "sha256 do PNG; monte a URL /program-icons/{hash}. Ausente quando o programa não declara ícone." }
        "404":
          description: Dispositivo não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}/screenshot:
    post:
      tags: [Horas]
      summary: Pede uma captura de tela do PC
      description: |
        Admin-only. Rate limit 30/min. Só marca o pedido: o comando é entregue
        no próximo heartbeat (até ~30s), o PC tira a foto, **mostra um aviso na
        própria tela** e envia a imagem. Não há captura periódica nem
        silenciosa, e quem pediu fica registrado junto da captura — a tela de um
        PC de uso compartilhado pode conter dado de quem está sentado nele.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido registrado; a imagem chega depois do próximo heartbeat.
        "404":
          description: Dispositivo não encontrado.
        "503":
          description: R2 não configurado no servidor (SCREENSHOT_STORAGE_UNSET).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}/screenshots:
    get:
      tags: [Horas]
      summary: Capturas de tela do PC, mais recente primeiro
      description: |
        Admin-only. `url` é assinada e vale 10 minutos. Só as 20 capturas mais
        recentes por PC são mantidas; as anteriores são apagadas na captura
        seguinte.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Histórico de capturas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenshots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        width: { type: integer }
                        height: { type: integer }
                        bytes: { type: integer }
                        requestedBy: { type: string, nullable: true, description: "Nome de quem pediu." }
                        requestedAt: { type: string, format: date-time, nullable: true }
                        capturedAt: { type: string, format: date-time }
                        url: { type: string, description: "URL assinada (10min)." }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-devices/{id}/screenshots/{shotId}:
    delete:
      tags: [Horas]
      summary: Apaga uma captura de tela
      description: |
        Admin-only. Rate limit 60/min. Apaga o registro **e** o arquivo no R2 —
        se o arquivo não sair, a resposta é erro: responder "apagado" com a
        imagem ainda no bucket seria pior que não ter o botão.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: shotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Registro e arquivo apagados.
        "404":
          description: Captura não encontrada (SCREENSHOT_NOT_FOUND).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /public/lab-devices/screenshot:
    post:
      tags: [Horas]
      summary: Envia a captura de tela (sem login, autenticado pelo segredo do dispositivo)
      description: |
        Só é aceita quando existe pedido recente do admin — 5 minutos desde a
        entrega do comando no heartbeat. A rota é pública (o PC não faz login),
        então sem essa janela um dispositivo poderia despejar imagens de tela
        quando quisesse. Rate limit 10/min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string, format: uuid }
                deviceSecret: { type: string }
                jpeg:
                  type: string
                  description: >
                    JPEG em base64 puro, até 6 MB decodificados. Precisa começar com a
                    assinatura JPEG (FF D8 FF) — a imagem é servida de volta pro navegador.
                width: { type: integer }
                height: { type: integer }
              required: [deviceId, jpeg]
      responses:
        "200":
          description: Captura registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
        "400":
          description: deviceId inválido ou imagem que não é JPEG.
        "401":
          description: Segredo do dispositivo ausente ou inválido (LAB_DEVICE_UNAUTHORIZED).
        "409":
          description: Nenhuma captura pendente para este dispositivo (SCREENSHOT_NOT_REQUESTED).
        "413":
          description: Imagem acima de 6 MB (SCREENSHOT_TOO_LARGE).
        "429":
          $ref: "#/components/responses/RateLimited"

  /hour-lab-expected-programs:
    get:
      tags: [Horas]
      summary: Lista os programas esperados nos PCs do laboratório
      description: Admin-only. Ordenado por nome.
      responses:
        "200":
          description: Programas cadastrados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items: { $ref: "#/components/schemas/ExpectedProgram" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Horas]
      summary: Cadastra um programa esperado
      description: |
        Admin-only. Rate limit 30/min. `matchPattern` é procurado por substring,
        sem diferenciar caixa, no nome que o Windows exibe — omitido, o `label`
        é usado. Curingas do LIKE (`%`, `_`, `\`) são recusados: um `%` solto
        casaria com qualquer programa e marcaria todo PC como em dia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
                matchPattern: { type: string, maxLength: 80 }
              required: [label]
      responses:
        "201":
          description: Programa criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: "#/components/schemas/ExpectedProgram" }
        "400":
          description: Nome vazio/longo demais, ou padrão com curinga.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hour-lab-expected-programs/{id}:
    patch:
      tags: [Horas]
      summary: Edita um programa esperado
      description: Admin-only. Rate limit 30/min. Mesmas regras do POST.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
                matchPattern: { type: string, maxLength: 80 }
              required: [label]
      responses:
        "200":
          description: Programa atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: "#/components/schemas/ExpectedProgram" }
        "400":
          description: Nome vazio/longo demais, ou padrão com curinga.
        "404":
          description: Programa não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Horas]
      summary: Remove um programa esperado
      description: |
        Admin-only. Rate limit 30/min. Some da checagem dos PCs; nada é
        desinstalado de máquina nenhuma.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Programa removido.
        "404":
          description: Programa não encontrado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/admin/drive-folders/browse:
    get:
      tags: [Arquivos]
      summary: Lista pastas do Drive já compartilhadas com a service account
      description: |
        Admin-only. Rate limit 30/min. Usado pro seletor de pasta na tela de
        criar/editar (em vez do admin colar o ID/URL na mão) — uma service
        account não tem "Meu Drive" próprio, então tudo que aparece aqui já
        foi compartilhado com ela manualmente no Google Drive.
      responses:
        "200":
          description: Pastas visíveis pela service account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                      required: [id, name]
                required: [folders]
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/admin/drive-folders:
    get:
      tags: [Arquivos]
      summary: Lista pastas de arquivos (Google Drive)
      description: Admin-only.
      responses:
        "200":
          description: Pastas cadastradas, ordenadas por nome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders: { type: array, items: { $ref: "#/components/schemas/DriveFolder" } }
                required: [folders]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Arquivos]
      summary: Cadastra pasta
      description: |
        Admin-only. Rate limit 20/min. `driveFolderId` aceita tanto o ID puro
        quanto a URL da pasta colada do navegador — o backend extrai o ID.
        A pasta correspondente no Google Drive precisa ser compartilhada
        manualmente com o e-mail da service account configurada no servidor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                driveFolderId: { type: string, description: "ID ou URL da pasta no Google Drive." }
              required: [name, driveFolderId]
      responses:
        "201":
          description: Pasta criada, sem nenhum acesso concedido ainda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder: { $ref: "#/components/schemas/DriveFolder" }
                required: [folder]
        "400":
          description: Nome ou ID da pasta ausente/inválido.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/admin/drive-folders/{id}:
    put:
      tags: [Arquivos]
      summary: Atualiza pasta
      description: Admin-only. Rate limit 30/min.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                driveFolderId: { type: string }
              required: [name, driveFolderId]
      responses:
        "200":
          description: Pasta atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder: { $ref: "#/components/schemas/DriveFolder" }
                required: [folder]
        "404":
          description: Pasta não encontrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Arquivos]
      summary: Exclui pasta
      description: |
        Admin-only + sudo mode. Apaga só o registro/ACL no dashboard — não
        exclui nada no Google Drive.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Excluída.
        "404":
          description: Pasta não encontrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/admin/drive-folders/{id}/access:
    get:
      tags: [Arquivos]
      summary: Lê a ACL de uma pasta
      description: Admin-only. Acesso por cargo (fixo/personalizado) e por usuário individual, união dos dois.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ACL atual da pasta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles: { type: array, items: { $ref: "#/components/schemas/DriveFolderRoleAccess" } }
                  members: { type: array, items: { $ref: "#/components/schemas/DriveFolderMemberAccess" } }
                required: [roles, members]
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Arquivos]
      summary: Substitui a ACL de uma pasta
      description: |
        Admin-only. Rate limit 30/min. Substitui o conjunto COMPLETO de acesso
        (cargos + membros) — o admin manda o estado final desejado, não deltas.
        `roleValue` é `"1"` (Student) ou `"2"` (Teacher) para `roleKind: fixed`,
        ou o UUID do cargo personalizado para `roleKind: custom`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: object
                    properties:
                      roleKind: { type: string, enum: [fixed, custom] }
                      roleValue: { type: string }
                      access: { type: string, enum: [read, write] }
                    required: [roleKind, roleValue, access]
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      userId: { type: integer }
                      access: { type: string, enum: [read, write] }
                    required: [userId, access]
              required: [roles, members]
      responses:
        "200":
          description: ACL substituída.
        "400":
          description: Entrada inválida (cargo/usuário duplicado, access fora de read/write, cargo fixo/personalizado inválido, usuário inexistente).
        "404":
          description: Pasta não encontrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/mine:
    get:
      tags: [Arquivos]
      summary: Lista as pastas que o usuário logado pode acessar
      description: |
        Autenticado (qualquer papel). Admin sempre vê todas com `access: write`;
        os demais só as pastas onde a ACL (cargo ou membro individual) dá
        `read` ou `write`.
      responses:
        "200":
          description: Pastas acessíveis, já com o nível de acesso resolvido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders: { type: array, items: { $ref: "#/components/schemas/MyDriveFolder" } }
                required: [folders]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/{id}/files:
    get:
      tags: [Arquivos]
      summary: Lista o conteúdo de uma pasta (arquivos e subpastas)
      description: |
        Exige acesso `read` (ou superior) na pasta raiz `{id}` — resolvido por
        registro (cargo/membro), não por permissão fixa de cargo. Rate limit
        60/min (a service account é compartilhada por todas as pastas/usuários
        — sem limite aqui, um único usuário podia estourar a cota do Drive pro
        ecossistema inteiro). Responde 503 se o Drive não estiver configurado
        (`GOOGLE_DRIVE_SA_JSON_B64` vazio). Itens vêm misturados (pastas e
        arquivos); distinga pelo `mimeType` (`application/vnd.google-apps.folder`
        = pasta) pra navegação estilo Drive. Pagina internamente pelo Drive
        (até 2000 itens); acima disso, devolve os 2000 primeiros e loga um
        aviso — sem paginação exposta na API ainda (pasta com mais de 2000
        itens é um caso raro, não vale a pena expor cursor por enquanto).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: parent
          in: query
          required: false
          schema: { type: string }
          description: |
            ID de uma SUBPASTA do Drive dentro da árvore de `{id}` (obtido do
            `id` de um item com mimeType de pasta na resposta anterior). Sem
            isso, lista a raiz. Validado via ancestralidade (IsDescendant) —
            um ID fora da árvore autorizada devolve 403.
      responses:
        "200":
          description: Conteúdo da pasta (ou subpasta, se `parent` informado).
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array, items: { $ref: "#/components/schemas/DriveFile" } }
                required: [files]
        "403":
          description: Sem acesso a essa pasta.
        "404":
          description: Pasta não encontrada.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Arquivos]
      summary: Envia um arquivo pra pasta (ou subpasta)
      description: |
        Exige acesso `write` na pasta raiz `{id}`. Rate limit 10/min.
        `multipart/form-data` com o arquivo no campo `file` (máx. 25MB),
        streamado direto pro Drive sem bufferizar o arquivo inteiro em
        memória. `?parent=<driveFileId>` envia pra uma SUBPASTA (mesma
        validação de ancestralidade do GET) em vez da raiz. Se o
        `Content-Type` declarado no multipart for de uma categoria "segura pra
        inline" (imagem/vídeo/áudio/PDF — mesma allowlist do endpoint de
        download), os bytes reais são conferidos contra ele (sniff dos
        primeiros 512 bytes); um `Content-Type` mentiroso (ex. HTML/script
        disfarçado de `image/png`) é rejeitado com 400 em vez de ir pro Drive.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: parent
          in: query
          required: false
          schema: { type: string }
          description: "ID de uma subpasta dentro da árvore de `{id}`; sem isso, envia pra raiz."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: Arquivo enviado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: "#/components/schemas/DriveFile" }
                required: [file]
        "400":
          description: Campo 'file' ausente ou requisição multipart inválida.
        "403":
          description: Sem acesso de escrita a essa pasta.
        "413":
          description: Arquivo maior que 25MB.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/{id}/files/{fileId}/download:
    get:
      tags: [Arquivos]
      summary: Baixa ou visualiza um arquivo (proxeado pelo backend)
      description: |
        Exige acesso `read` na pasta. Rate limit 60/min (mesmo motivo da
        listagem — quota da service account é compartilhada). O download
        SEMPRE passa pelo backend (nunca um link direto do Drive) — quem tem
        permissão no Drive é a service account, não o usuário final; a
        autorização real é a ACL deste dashboard. Por padrão abre INLINE (o
        navegador renderiza
        imagem/vídeo/PDF quando sabe); `?download=1` força o download
        (Content-Disposition: attachment). Suporta o header `Range` — dá pra
        dar seek num vídeo sem baixar o arquivo inteiro. **Segurança:** só uma
        allowlist de tipos (imagem, vídeo, áudio, PDF — exceto `image/svg+xml`,
        que pode ter `<script>` embutido) pode abrir INLINE; qualquer outro
        `Content-Type` é sempre forçado a `attachment` +
        `application/octet-stream`, mesmo sem `?download=1`, e a resposta leva
        `X-Content-Type-Options: nosniff` — evita XSS armazenado a partir de um
        upload que declarou um tipo de mídia mas contém HTML/script.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
        - name: download
          in: query
          required: false
          schema: { type: string }
          description: "Qualquer valor não-vazio força `Content-Disposition: attachment`."
      responses:
        "200":
          description: Conteúdo binário do arquivo, com Content-Type e Content-Disposition (inline por padrão).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Conteúdo parcial (resposta a um header `Range`) — usado pelo player de vídeo pra seek.
        "403":
          description: Sem acesso a essa pasta.
        "502":
          description: Falha ao baixar do Drive.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/{id}/files/{fileId}/thumbnail:
    get:
      tags: [Arquivos]
      summary: Miniatura de um arquivo (proxeada pelo backend)
      description: |
        Exige acesso `read` na pasta. Rate limit 120/min (chamado uma vez por
        item visível na lista/grade). `thumbnailLink` do Drive não é uma URL
        pública — exige o Bearer token da service account, por isso o proxy
        (não dá pra apontar um `<img src>` direto pra ela do navegador). Nem
        todo arquivo tem miniatura (Drive não gera pra todo tipo): 404 nesse
        caso — o frontend cai pro ícone genérico do tipo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Imagem da miniatura (Cache-Control 1h).
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "403":
          description: Sem acesso a essa pasta.
        "404":
          description: Arquivo sem miniatura.
        "502":
          description: Falha ao buscar do Drive.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/{id}/files/{fileId}:
    patch:
      tags: [Arquivos]
      summary: Renomeia um arquivo ou subpasta
      description: |
        Exige acesso `write` na pasta raiz `{id}` (não precisa ser Admin —
        qualquer usuário/cargo com `write` nessa pasta pode renomear). Rate
        limit 30/min. `fileId` é validado por ancestralidade (IsDescendant)
        contra a árvore de `{id}` — não dá pra renomear algo fora do escopo
        autorizado só adivinhando o ID no Drive. `fileId` igual ao
        `driveFolderId` da própria pasta raiz é sempre rejeitado (403) — sem
        essa checagem, "renomear a raiz" seria um caso técnico válido de
        ancestralidade, e afetaria todo mundo com acesso àquela pasta.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
              required: [name]
      responses:
        "200":
          description: Arquivo renomeado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: "#/components/schemas/DriveFile" }
                required: [file]
        "400":
          description: Nome ausente/vazio ou maior que 255 caracteres.
        "403":
          description: Sem acesso de escrita a essa pasta, ou fileId fora da árvore autorizada.
        "502":
          description: Falha ao renomear no Drive.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Arquivos]
      summary: Move um arquivo ou subpasta pra lixeira do Drive
      description: |
        Exige acesso `write` na pasta raiz `{id}` (mesma regra do renomear —
        qualquer usuário/cargo com `write`, não só Admin). Rate limit 30/min.
        `fileId` validado por ancestralidade, igual ao renomear/download —
        incluindo a mesma rejeição de `fileId` igual ao `driveFolderId` da
        própria pasta (não dá pra mandar a pasta raiz inteira pra lixeira por
        aqui). Move pra lixeira do Google Drive — **não** é exclusão permanente
        (mesmo comportamento do botão "Remover" da UI do próprio Drive;
        reversível de lá pelo dono real do arquivo).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Movido pra lixeira.
        "403":
          description: Sem acesso de escrita a essa pasta, ou fileId fora da árvore autorizada.
        "502":
          description: Falha ao mover pra lixeira no Drive.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/{id}/folders:
    post:
      tags: [Arquivos]
      summary: Cria uma subpasta
      description: |
        Exige acesso `write` na pasta raiz `{id}`. Rate limit 20/min. Cria a
        subpasta na raiz por padrão, ou dentro de `?parent=<driveFileId>` se
        informado (mesma validação de ancestralidade das demais rotas de
        arquivo — `parent` precisa estar dentro da árvore de `{id}`).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: parent
          in: query
          required: false
          schema: { type: string }
          description: "ID de uma subpasta dentro da árvore de `{id}`; sem isso, cria na raiz."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
              required: [name]
      responses:
        "201":
          description: Subpasta criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: "#/components/schemas/DriveFile" }
                required: [file]
        "400":
          description: Nome ausente/vazio ou maior que 255 caracteres.
        "403":
          description: Sem acesso de escrita a essa pasta, ou parent fora da árvore autorizada.
        "502":
          description: Falha ao criar a pasta no Drive.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drive-folders/{id}/files/{fileId}/move:
    patch:
      tags: [Arquivos]
      summary: Move um arquivo ou subpasta pra outro lugar DENTRO da mesma pasta vinculada
      description: |
        Exige acesso `write` na pasta raiz `{id}`. Rate limit 30/min. `fileId`
        e o destino (`toParent` no corpo, ou a raiz da pasta se omitido) são
        validados por ancestralidade contra `{id}` — só dá pra reorganizar
        DENTRO da mesma pasta vinculada, não mover pra outra pasta raiz
        (exigiria checar acesso de escrita nela também, fora do escopo desta
        rota). Rejeita mover um item pra dentro dele mesmo, e mover uma pasta
        pra dentro de uma subpasta dela mesma (ciclo).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                toParent: { type: string, description: "ID de uma subpasta dentro da árvore de `{id}`; sem isso, move pra raiz." }
      responses:
        "200":
          description: Arquivo movido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: "#/components/schemas/DriveFile" }
                required: [file]
        "400":
          description: Corpo inválido, destino igual ao próprio item, ou moveria a pasta pra dentro dela mesma.
        "403":
          description: Sem acesso de escrita a essa pasta, ou fileId/toParent fora da árvore autorizada.
        "502":
          description: Falha ao mover no Drive.
        "503":
          description: Google Drive não configurado.
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT de acesso (HS256), setado como cookie httpOnly no login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Mesmo JWT de acesso enviado como `Authorization: Bearer <token>`."
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: JWT de refresh (httpOnly), usado apenas em `/auth/refresh`.
    refreshBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Refresh token via `Authorization: Bearer <refresh_token>`, usado apenas em
        `/auth/refresh` por clientes sem cookie jar (ex. app mobile), como alternativa
        ao `refreshCookie`.

  headers:
    AuthCookies:
      description: |
        Define os cookies de sessão `access_token` (2h) e `refresh_token` (7 dias),
        ambos `HttpOnly`, `SameSite=Lax`, `Domain=COOKIE_DOMAIN` e `Secure` em produção.
      schema: { type: string }
    ClearAuthCookies:
      description: Expira os cookies `access_token` e `refresh_token` (Max-Age=-1).
      schema: { type: string }

  responses:
    Ok:
      description: Sucesso genérico
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, const: ok }
            required: [message]
    ValidationError:
      description: Corpo inválido / validação falhou
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: VALIDATION_ERROR, message: "corpo inválido" }
    Unauthorized:
      description: Não autenticado / token inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNAUTHORIZED, message: "Não autenticado" }
    RateLimited:
      description: Limite de requisições excedido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: RATE_LIMITED, message: "Muitas tentativas. Tente novamente em instantes." }
    APIRouterNotConfigured:
      description: "API_VAULT_SECRET não configurada — roteador de chaves de API desabilitado"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: NOT_CONFIGURED, message: "Roteador de APIs indisponível: API_VAULT_SECRET não configurada" }

  schemas:
    Error:
      type: object
      description: Formato padrão de erro.
      properties:
        code: { type: string, description: "Código estável legível por máquina" }
        message: { type: string, description: "Mensagem em português para humanos" }
      required: [code, message]

    SentryIssue:
      type: object
      description: Issue (grupo de eventos de erro) do Sentry, como devolvida por /sentry/issues.
      properties:
        id: { type: string }
        shortId: { type: string, description: "Ex.: API-GO-12" }
        title: { type: string }
        culprit: { type: string, description: "Função/rota onde o erro ocorreu" }
        level: { type: string, enum: [debug, info, warning, error, fatal] }
        status: { type: string, enum: [unresolved, resolved, ignored] }
        count: { type: string, description: "Total de eventos (string — o Sentry devolve como texto)" }
        userCount: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        permalink: { type: string, description: "Link direto pra issue no sentry.io" }
        project:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }

    SentryIssueDetail:
      description: SentryIssue + exceção/stacktrace do evento mais recente e tags, devolvida por /sentry/issues/{id}.
      allOf:
        - $ref: "#/components/schemas/SentryIssue"
        - type: object
          properties:
            exceptions:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, description: "Ex.: TypeError" }
                  value: { type: string, description: "Mensagem da exceção" }
                  frames:
                    type: array
                    description: "Do ponto do crash pro chamador raiz (mais recente primeiro)."
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        function: { type: string }
                        lineNo: { type: integer }
                        colNo: { type: integer }
                        contextLine: { type: string, description: "Linha de código no ponto do frame" }
                        inApp: { type: boolean, description: "Código do próprio serviço (não de dependência)" }
            tags:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }

    PostHogOverview:
      type: object
      description: Totais de /analytics/overview — período atual e anterior de mesmo tamanho.
      properties:
        pageviews: { type: integer }
        visitors: { type: integer, description: "Visitantes únicos (person_id distinto)" }
        prevPageviews: { type: integer }
        prevVisitors: { type: integer }

    PostHogTimeseriesPoint:
      type: object
      description: Um ponto de /analytics/timeseries — pageviews de um dia.
      properties:
        bucket: { type: string, description: "Data (YYYY-MM-DD)" }
        pageviews: { type: integer }

    PostHogCount:
      type: object
      description: Um item de ranking (páginas, referrers, ou site) — {key,count}.
      properties:
        key: { type: string, description: "Página, domínio de referrer, ou nome do site" }
        count: { type: integer }

    # ── payments-go schemas ────────────────────────────────────────────────
    Movement:
      type: object
      description: |
        Movimento financeiro do extrato: entrada (pagamento recebido) ou saída (saque).
        Derivado de cobranças pagas e saques registrados em payments-go.
      properties:
        id:
          type: integer
          format: int64
          description: ID da cobrança (direction=in) ou do saque (direction=out).
        type:
          type: string
          enum: [pix_in, boleto_in, card_in, fee, payout]
          description: >
            Tipo do movimento: `pix_in`/`boleto_in`/`card_in` para entradas por método;
            `fee` para taxas; `payout` para saques.
        direction:
          type: string
          enum: [in, out]
          description: "`in` = entrada de valor; `out` = saída de valor."
        method:
          type: string
          enum: [pix, boleto, card, ""]
          description: Método de pagamento (vazio para saques).
        valueCents:
          type: integer
          format: int64
          description: Valor em centavos (sempre positivo).
        customerName:
          type: string
          description: Nome do pagador (present only for entries).
        customerEmail:
          type: string
          description: Email do pagador (presente apenas em entradas).
        date:
          type: string
          format: date-time
          description: Data do movimento (paid_at para cobranças, created_at para saques).
      required: [id, type, direction, method, valueCents, date]

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, minLength: 8, format: password }
      required: [email, name, password]

    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Email ou username
        password: { type: string, format: password }
      required: [identifier, password]

    NewUser:
      type: object
      description: Usuário recém-criado (subset enxuto retornado no registro).
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, email, name, createdAt]

    UserProfile:
      type: object
      description: Perfil seguro do usuário (sem dados sensíveis).
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        username:
          type: [string, "null"]
        name: { type: string }
        role:
          type: integer
          description: "1=Student, 2=Teacher, 3=Admin, 4=Custom"
          enum: [1, 2, 3, 4]
        customRoleId:
          type: [string, "null"]
          description: ID do custom_role quando role=4
        avatarUrl:
          type: [string, "null"]
        mfaEnabled: { type: boolean }
        suspendedAt:
          type: [string, "null"]
          format: date-time
        permissions:
          type: [object, "null"]
          description: "Permissões resolvidas quando role=4 (mapa recurso → ações)."
          additionalProperties:
            type: array
            items: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, email, name, role, mfaEnabled, createdAt]

    SessionResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
        accessToken:
          type: string
          description: |
            Presente apenas quando o request não tem header `Origin` (cliente não-browser,
            ex. app mobile — navegadores sempre mandam `Origin` em POST). Fluxo web normal
            nunca recebe isto, só o cookie httpOnly.
        refreshToken:
          type: string
          description: Mesma condição de `accessToken`.
      required: [user]

    MfaChallengeResponse:
      type: object
      description: Devolvido pelo login quando o usuário tem MFA ativo.
      properties:
        mfaRequired: { type: boolean, const: true }
        challenge:
          type: string
          description: Token de uso único (10min) para o 2º passo do login.
      required: [mfaRequired, challenge]

    AccountSummary:
      type: object
      description: Visão de uma conta conhecida no cookie multi-conta deste navegador.
      properties:
        sessionId:
          type: string
          format: uuid
          description: ID da sessão (referência para activate/delete).
        name:
          type: string
          description: Nome do usuário.
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, "null"]
          description: URL do avatar no R2 (null se não configurado).
        active:
          type: boolean
          description: Verdadeiro se esta sessão corresponde ao `refresh_token` atual.
      required: [sessionId, name, email, avatarUrl, active]

    Download:
      type: object
      description: Item público do catálogo de downloads (Santos Hub).
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        version: { type: string }
        kind: { type: string, enum: [file, link] }
        url:
          type: string
          format: uri
          description: URL pública do R2 (kind=file) ou a URL externa cadastrada (kind=link).
        sizeBytes:
          type: integer
          format: int64
          description: Ausente para kind=link.
        pinned: { type: boolean, description: Favoritado — aparece no topo da lista. }
        updatedAt: { type: string, format: date-time }
        imageUrl:
          type: string
          format: uri
          description: Foto/ícone do item pro grid (Santos Hub e admin) — URL livre, opcional.
      required: [id, name, description, category, version, kind, url, pinned, updatedAt]
    DownloadAdmin:
      description: Mesmo objeto de `Download`, com os campos internos que só o admin vê.
      allOf:
        - $ref: "#/components/schemas/Download"
        - type: object
          properties:
            filename: { type: string }
            contentType: { type: string }
            objectKey: { type: string, description: Chave no R2 — presente só para kind=file. }
            uploadedBy: { type: integer, description: ID do admin que cadastrou (ausente se a conta foi removida). }
            createdAt: { type: string, format: date-time }
    Model3DFile:
      type: object
      description: Modelo 3D salvo na biblioteca admin (R2 + Postgres).
      properties:
        id:
          type: integer
          format: int64
        filename:
          type: string
          description: Nome original do arquivo enviado.
        ext:
          type: string
          enum: [glb, gltf, stl, obj, fbx, blend]
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
          format: uri
          description: URL pública do objeto no R2.
        uploadedBy:
          type: integer
          description: ID do admin que enviou (ausente se a conta foi removida).
        createdAt:
          type: string
          format: date-time
        folder:
          type: string
          description: Pasta simples (1 nível) para organização — string livre, vazia se não estiver em nenhuma.
        pinned:
          type: boolean
          description: Favoritado — aparece no topo da lista.
        thumbnailUrl:
          type: string
          format: uri
          description: |
            Só presente para `.blend` salvo com "Save Preview Images" no Blender —
            miniatura estática (PNG) extraída do bloco TEST embutido no arquivo no
            momento do upload. Ausente para os demais formatos (que têm preview 3D
            real via `Model3DViewer`) e para `.blend` sem miniatura salva.
      required: [id, filename, ext, contentType, sizeBytes, url, createdAt, folder, pinned]
    AdminUser:
      type: object
      description: Usuário retornado nas rotas de gestão admin.
      properties:
        id:
          type: integer
          format: int64
          description: ID interno do usuário.
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: integer
          description: "1=Aluno, 2=Professor, 3=Admin."
          enum: [1, 2, 3]
        suspendedAt:
          type: [string, "null"]
          format: date-time
          description: Data de suspensão (null se ativa).
        createdAt:
          type: string
          format: date-time
        mfaEnabled:
          type: boolean
          description: Se o usuário tem MFA configurado.
        quotaBytes:
          type: integer
          format: int64
          description: Cota de armazenamento em bytes (0 = sem limite definido).
        pending:
          type: boolean
          description: Convite ainda não aceito (usuário não definiu senha).
        loginDisabled:
          type: boolean
          description: |
            true = caixa institucional compartilhada sem login. A conta não
            autentica por nenhum caminho (senha, OAuth, "esqueci a senha") e
            não recebe convite.
      required: [id, email, name, role, suspendedAt, createdAt, mfaEnabled, quotaBytes, pending, loginDisabled]

    OAuthClient:
      type: object
      description: Aplicação OAuth registrada ("Entrar com Santos Tech").
      properties:
        id:
          type: string
          format: uuid
          description: UUID interno (usado nas rotas PATCH/DELETE).
        clientId:
          type: string
          description: Identificador público da aplicação (passado em `/oauth/authorize`).
        name:
          type: string
          description: Nome exibido no chooser de contas.
        redirectUris:
          type: array
          items: { type: string, format: uri }
          description: Lista de redirect URIs autorizados.
        isActive:
          type: boolean
          description: Se falso, o fluxo de autorização é bloqueado para este client.
        createdAt:
          type: string
          format: date-time
      required: [id, clientId, name, redirectUris, isActive, createdAt]

    OAuthTokenResponse:
      type: object
      description: Resposta de tokens do endpoint `/oauth/token` (RFC 6749 §5.1).
      properties:
        access_token:
          type: string
          description: JWT HS256 de acesso (TTL 2h).
        refresh_token:
          type: string
          description: JWT HS256 de refresh (TTL 7d). Uso único — rotacionado a cada chamada.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Duração do access_token em segundos.
          example: 7200
      required: [access_token, refresh_token, token_type, expires_in]

    # ── Blog ────────────────────────────────────────────────────────────────
    BlogCategoryPublic:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
      required: [slug, name]

    BlogAuthorPublic:
      type: object
      properties:
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
      required: [name]

    BlogPostSummaryPublic:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImageUrl: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/BlogCategoryPublic" }
        author: { $ref: "#/components/schemas/BlogAuthorPublic" }
        publishedAt: { type: string, format: date-time }
      required: [slug, title, excerpt, category, author, publishedAt]

    BlogPostPublic:
      allOf:
        - $ref: "#/components/schemas/BlogPostSummaryPublic"
        - type: object
          properties:
            contentHtml: { type: string }
          required: [contentHtml]

    BlogCategory:
      type: object
      description: Categoria — view admin (com id).
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
      required: [id, slug, name]

    BlogCategoryInput:
      type: object
      properties:
        slug: { type: string, description: "Minúsculo, números e hífens (ex.: novidades)." }
        name: { type: string }
      required: [slug, name]

    BlogPost:
      type: object
      description: Post — view admin (todos os campos, qualquer status).
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        categoryId: { type: string, format: uuid }
        categorySlug: { type: string }
        categoryName: { type: string }
        authorId: { type: integer, format: int64, nullable: true }
        authorName: { type: string }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, slug, title, excerpt, contentHtml, categoryId, status, createdAt, updatedAt]

    BlogPostInput:
      type: object
      properties:
        slug: { type: string, description: "Minúsculo, números e hífens." }
        title: { type: string }
        excerpt: { type: string }
        contentHtml: { type: string, description: "HTML do corpo do post (editor rich text)." }
        coverImageUrl: { type: string, nullable: true, description: "URL devolvida por POST /auth/upload." }
        categoryId: { type: string, format: uuid }
        status: { type: string, enum: [draft, published], default: draft }
      required: [slug, title, categoryId]

    BlogMetricsOverview:
      type: object
      description: Resumo do período, com comparação vs período anterior de mesma duração.
      properties:
        pageviews: { type: integer, format: int64 }
        visitors: { type: integer, format: int64, description: "Visitantes únicos (dedup por visitorId)." }
        ctaClicks: { type: integer, format: int64 }
        conversionRate: { type: number, format: double, description: "ctaClicks / visitors." }
        prevPageviews: { type: integer, format: int64 }
        prevVisitors: { type: integer, format: int64 }
        prevCtaClicks: { type: integer, format: int64 }
        prevConversionRate: { type: number, format: double }
      required: [pageviews, visitors, ctaClicks, conversionRate, prevPageviews, prevVisitors, prevCtaClicks, prevConversionRate]

    BlogMetricsTimeseriesPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time, description: "Início do dia (ou hora, se from/to ≤ 24h)." }
        pageviews: { type: integer, format: int64 }
      required: [bucket, pageviews]

    BlogMetricsTopPost:
      type: object
      properties:
        postSlug: { type: string }
        title: { type: string, description: "Título do post (cai pro slug se o post foi apagado)." }
        views: { type: integer, format: int64 }
        ctaClicks: { type: integer, format: int64 }
        conversionRate: { type: number, format: double, description: "ctaClicks / views." }
      required: [postSlug, title, views, ctaClicks, conversionRate]

    BlogMetricsCount:
      type: object
      description: Contagem genérica por chave categórica (referrer, utm_source, device ou country).
      properties:
        key: { type: string }
        count: { type: integer, format: int64 }
      required: [key, count]

    BlogHeatmapClickBucket:
      type: object
      properties:
        xBucket: { type: integer }
        yBucket: { type: integer }
        count: { type: integer, format: int64 }
      required: [xBucket, yBucket, count]

    BlogHeatmapClickGrid:
      type: object
      description: |
        Grade de cliques já binada — nunca pontos crus. xBucket/yBucket são
        índices de grade; o admin converte pra posição real com
        (bucket+0.5)/cols (ou /rows) × largura/altura REAL do preview
        renderizado — nunca multiplicando por referenceWidth diretamente
        (que é só informativo).
      properties:
        referenceWidth: { type: integer, description: "Largura de referência do preview no admin (1024 desktop — o limiar do breakpoint lg:, 390 mobile). Informativo." }
        cols: { type: integer, description: "Número de colunas da grade (eixo X)." }
        rows: { type: integer, description: "Número de linhas da grade (eixo Y)." }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/BlogHeatmapClickBucket" }
      required: [referenceWidth, cols, rows, buckets]

    BlogHeatmapScrollDecile:
      type: object
      properties:
        decile: { type: number, format: double, description: "0.1 a 1.0 — profundidade do post." }
        reached: { type: integer, format: int64, description: "Sessões que chegaram até pelo menos esse decil." }
        total: { type: integer, format: int64, description: "Total de sessões no período." }
      required: [decile, reached, total]

    APIRouterProviderInput:
      type: object
      properties:
        name: { type: string, description: "Único; identifica o provider." }
        baseUrl: { type: string, example: "https://api.openai.com" }
        authHeader: { type: string, default: Authorization }
        authScheme: { type: string, default: Bearer, description: "Prefixo antes da chave no header; string vazia = sem prefixo." }
        unauthorizedCodes: { type: array, items: { type: integer }, default: [401], description: "Códigos que fazem o roteador marcar a chave unauthorized e tentar a próxima." }
        noCreditCodes: { type: array, items: { type: integer }, default: [402, 429], description: "Códigos que fazem o roteador marcar a chave no_credits e tentar a próxima." }
        testPath: { type: string, description: "Path usado pelo botão \"testar chave\"; vazio = raiz da baseUrl." }
        testMethod: { type: string, default: GET }
        chatAdapter: { type: string, enum: [openai_compatible, anthropic, google, cohere], default: openai_compatible, description: "Formato usado por POST .../chat pra montar a requisição nativa. openai_compatible cobre OpenAI, Mistral, DeepSeek, xAI/Grok." }
        chatPath: { type: string, description: "Path do endpoint de chat nativo (ex.: /api/v1/chat/completions na OpenRouter). Vazio = usa o default do adapter." }
        chatModel: { type: string, description: "Modelo default do /chat quando o corpo não informa model (ex.: mistral-large-latest na Mistral). Vazio = usa o default do adapter." }
      required: [name, baseUrl]
    APIRouterProvider:
      allOf:
        - $ref: "#/components/schemas/APIRouterProviderInput"
        - type: object
          properties:
            id: { type: integer }
            keyCounts: { type: object, additionalProperties: { type: integer }, description: 'Contagem de chaves por status, ex. {"active":2,"unauthorized":1}.' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, keyCounts, createdAt, updatedAt]
    APIRouterKeyInput:
      type: object
      properties:
        label: { type: string, example: "conta principal" }
        secret: { type: string, description: "Valor real da chave — cifrado (AES-256-GCM) antes de persistir; nunca é reexibido." }
        priority: { type: integer, default: 0, description: "Menor valor = tentada primeiro." }
      required: [label, secret]
    APIRouterKey:
      type: object
      description: "Inclui o segredo decifrado (rota admin-only) — é o único ponto em que o valor cru sai do banco. `secret` vem vazio se a decifragem falhar."
      properties:
        id: { type: integer }
        providerId: { type: integer }
        label: { type: string }
        secretTail: { type: string, example: "7890" }
        secret: { type: string, description: "Valor real da chave, decifrado do AES-256-GCM.", example: "sk-1234567890abcdef7890" }
        status: { type: string, enum: [active, unauthorized, no_credits, disabled] }
        priority: { type: integer }
        failureCount: { type: integer }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }
        lastErrorCode: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, providerId, label, secretTail, status, priority, failureCount, createdAt, updatedAt]
    APIRouterTestResult:
      type: object
      properties:
        statusCode: { type: integer, description: "0 quando a requisição nem chegou a ter resposta (erro de rede/DNS)." }
        outcome: { type: string, enum: [success, unauthorized, no_credits, transport_error] }
        error: { type: string, description: "Mensagem de erro de transporte; vazio nos outros casos." }
      required: [statusCode, outcome]

    HourClient:
      type: object
      description: Cliente do controle de horas (lan house/escola) — não tem login no ecossistema.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        balanceMinutes: { type: integer, description: "Nunca fica negativo — trava em 0 no encerramento da sessão (o excedente vira tempo avulso, ver GET /hour-billing)." }
        discountPercent: { type: integer, description: "Desconto padrão (0-100) aplicado no faturamento avulso deste cliente — ver GET /hour-billing e PATCH /hour-clients/{id}." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, balanceMinutes, discountPercent, createdAt, updatedAt]

    HourSession:
      type: object
      description: |
        Sessão de horas de um cliente. `elapsedSeconds` é sempre recalculado a
        partir do histórico de eventos (start/pause/resume/end), nunca um
        contador guardado.
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        status: { type: string, enum: [scheduled, active, paused, ended], description: "scheduled = ainda não começou (ver scheduledStartAt); vira active sozinha." }
        pauseRequestedAt: { type: string, format: date-time, nullable: true }
        scheduledEndAt: { type: string, format: date-time, nullable: true, description: "Fim agendado opcional — sessão encerra sozinha ao passar (ver POST /hour-sessions). Null = duração livre." }
        scheduledStartAt: { type: string, format: date-time, nullable: true, description: "Início agendado opcional — sessão nasce status scheduled e vira active sozinha ao passar (ver POST /hour-sessions). Null = começa na hora." }
        elapsedSeconds: { type: integer }
        balanceMinutes: { type: integer, description: "Saldo atual do cliente (antes de debitar o tempo desta sessão, que só é debitado no end)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, clientId, clientName, status, elapsedSeconds, balanceMinutes, createdAt, updatedAt]

    LabDevice:
      type: object
      description: PC do laboratório rodando o hour-timer-app. "Online/offline" não é campo — decida por lastSeenAt.
      properties:
        id: { type: string, format: uuid }
        deviceUuid: { type: string, format: uuid, description: "Identidade gerada localmente pelo app no primeiro boot." }
        name: { type: string, nullable: true, description: "Atribuído pelo admin; null até a primeira renomeação." }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastIp: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        currentSessionId: { type: string, format: uuid, nullable: true }
        currentClientName: { type: string, nullable: true }
        currentStatus: { type: string, enum: [active, paused, ended], nullable: true }
        createdAt: { type: string, format: date-time }
        openApps:
          type: array
          items: { type: string }
          description: "Nomes dos aplicativos abertos no último heartbeat (app 0.1.9+)."
        openAppsAt:
          type: string
          format: date-time
          nullable: true
          description: "Quando a lista de abertos foi vista; null = o PC nunca reportou."
        sshPublicKey:
          type: string
          nullable: true
          description: "Chave pública SSH mandada no primeiro heartbeat (ver POST /public/lab-devices/heartbeat); null = máquina não manda (imagem antiga, ou não provisionada via autounattend.xml)."
      required: [id, deviceUuid, createdAt]

    ExpectedProgram:
      type: object
      description: |
        Programa que todo PC do laboratório deveria ter. O cruzamento com o que
        cada máquina reportou sai em /hour-lab-devices/{id}/programs.
      properties:
        id: { type: integer, format: int64 }
        label: { type: string, description: "Nome exibido no dashboard (ex.: Unity)." }
        matchPattern: { type: string, description: "Trecho procurado no nome instalado, sem diferenciar caixa." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, label, matchPattern, createdAt, updatedAt]

    DriveFolder:
      type: object
      description: Metadados de uma pasta vinculada ao Google Drive (visão admin). O conteúdo em si mora no Drive; ver DriveFile.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        driveFolderId: { type: string, description: "ID da pasta no Google Drive (já extraído de URL, se colada)." }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, description, driveFolderId, createdBy, createdAt, updatedAt]

    MyDriveFolder:
      type: object
      description: Visão de uma pasta pro usuário comum — sem createdBy, com o nível de acesso efetivo já resolvido.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        driveFolderId: { type: string }
        access: { type: string, enum: [read, write] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, description, driveFolderId, access, createdAt, updatedAt]

    DriveFolderRoleAccess:
      type: object
      description: Entrada de ACL por cargo.
      properties:
        roleKind: { type: string, enum: [fixed, custom] }
        roleValue: { type: string, description: "'1'=Student/'2'=Teacher pra fixed; UUID do cargo pra custom." }
        access: { type: string, enum: [read, write] }
      required: [roleKind, roleValue, access]

    DriveFolderMemberAccess:
      type: object
      description: Entrada de ACL por usuário individual, já enriquecida com nome/email pra tela de gestão.
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        access: { type: string, enum: [read, write] }
        addedAt: { type: string, format: date-time }
      required: [userId, name, email, access, addedAt]

    DriveFile:
      type: object
      description: Arquivo dentro de uma pasta do Drive — espelho reduzido da resposta da Drive API v3.
      properties:
        id: { type: string, description: "ID do arquivo no Google Drive." }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer, format: int64 }
        modifiedTime: { type: string, format: date-time }
        iconLink: { type: string, nullable: true }
      required: [id, name, mimeType, size, modifiedTime]

# Por padrão, as rotas exigem o access_token (cookie ou Bearer).
# Rotas públicas sobrescrevem com `security: []`.
security:
  - cookieAuth: []
  - bearerAuth: []
