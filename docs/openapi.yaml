  /blog/metrics/heatmap/clicks:
    get:
      tags: [Blog Analytics]
      summary: Grade de cliques binada (heatmap), para 1 post e 1 bucket de viewport
      description: |
        Requer `blog_posts:read`. Nunca devolve pontos crus — só a grade já
        agregada (`cols`/`rows` + buckets), pro admin reconstruir o heatmap
        com heatmap.js. postSlug e viewport são obrigatórios (heatmap não faz
        sentido agregado entre posts nem entre mobile/desktop). cols/rows são
        opcionais — o admin manda os dois calculados a partir do tamanho REAL
        já medido do post renderizado (célula de ~35px), porque uma grade de
        tamanho fixo não acompanha a variação de altura entre posts; sem eles,
        cai no default (30×60) e satura em [10,400].
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - { in: query, name: postSlug, required: true, schema: { type: string } }
        - { in: query, name: viewport, required: true, schema: { type: string, enum: [mobile, desktop] } }
        - { in: query, name: cols, schema: { type: integer, minimum: 10, maximum: 400 }, description: "Colunas da grade (eixo X). Default 30." }
        - { in: query, name: rows, schema: { type: integer, minimum: 10, maximum: 400 }, description: "Linhas da grade (eixo Y). Default 60." }
      responses:
        "200":
          description: Grade de cliques do post/viewport no período.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogHeatmapClickGrid" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sem a permissão blog_posts:read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blog/metrics/heatmap/scroll:
    get:
      tags: [Blog Analytics]
      summary: Funil de profundidade de rolagem (10 decis), para 1 post e 1 bucket de viewport
      description: |
        Requer `blog_posts:read`. Cada decil traz quantas sessões (de-dup por
        session_id, pegando a profundidade MÁXIMA de cada uma) chegaram até
        pelo menos aquele ponto do post.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - { in: query, name: postSlug, required: true, schema: { type: string } }
        - { in: query, name: viewport, required: true, schema: { type: string, enum: [mobile, desktop] } }
      responses:
        "200":
          description: Funil de profundidade do post/viewport no período.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlogHeatmapScrollDecile" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sem a permissão blog_posts:read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sentry/issues:
    get:
      tags: [Observabilidade]
      summary: Lista issues (erros) do Sentry de todos os projetos do ecossistema
      description: |
        Admin-only. Responde 503 se `SENTRY_API_TOKEN`/`SENTRY_ORG_SLUG` não
        configurados. Só leitura — resolver/ignorar uma issue continua no
        próprio sentry.io (link em `permalink`).
      parameters:
        - { in: query, name: project, description: "Slug de um serviço específico (ver /sentry/projects). Omitido = todos.", schema: { type: string } }
        - { in: query, name: status, description: "unresolved (default) | resolved | ignored | all", schema: { type: string } }
        - { in: query, name: q, description: "Texto livre, vira parte do `query` de busca do Sentry.", schema: { type: string } }
        - { in: query, name: stats_period, description: "24h | 14d (default) | 90d", schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: Issues encontradas, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/SentryIssue" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: SENTRY_API_TOKEN não configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sentry/issues/{id}:
    get:
      tags: [Observabilidade]
      summary: Detalhe de uma issue — exceção/stacktrace do evento mais recente + tags
      description: |
        Admin-only. Combina GET /issues/{id}/ e GET /issues/{id}/events/latest/
        do Sentry num DTO já normalizado (frames do crash primeiro). Deixa
        investigar o erro sem sair do dashboard; ações (resolver/ignorar)
        continuam no sentry.io (link em `permalink`).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detalhe da issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentryIssueDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Erro ao consultar o Sentry (issue inexistente, timeout, etc.).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: SENTRY_API_TOKEN não configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sentry/projects:
    get:
      tags: [Observabilidade]
      summary: Lista os slugs dos projetos do Sentry (popula o filtro da tela de Erros)
      description: Admin-only. Responde 503 se SENTRY_API_TOKEN não configurado.
      responses:
        "200":
          description: Slugs conhecidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT de acesso (HS256), setado como cookie httpOnly no login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Mesmo JWT de acesso enviado como `Authorization: Bearer <token>`."
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: JWT de refresh (httpOnly), usado apenas em `/auth/refresh`.
    refreshBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Refresh token via `Authorization: Bearer <refresh_token>`, usado apenas em
        `/auth/refresh` por clientes sem cookie jar (ex. app mobile), como alternativa
        ao `refreshCookie`.

  headers:
    AuthCookies:
      description: |
        Define os cookies de sessão `access_token` (2h) e `refresh_token` (7 dias),
        ambos `HttpOnly`, `SameSite=Lax`, `Domain=COOKIE_DOMAIN` e `Secure` em produção.
      schema: { type: string }
    ClearAuthCookies:
      description: Expira os cookies `access_token` e `refresh_token` (Max-Age=-1).
      schema: { type: string }

  responses:
    Ok:
      description: Sucesso genérico
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, const: ok }
            required: [message]
    ValidationError:
      description: Corpo inválido / validação falhou
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: VALIDATION_ERROR, message: "corpo inválido" }
    Unauthorized:
      description: Não autenticado / token inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNAUTHORIZED, message: "Não autenticado" }
    RateLimited:
      description: Limite de requisições excedido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: RATE_LIMITED, message: "Muitas tentativas. Tente novamente em instantes." }
    APIRouterNotConfigured:
      description: "API_VAULT_SECRET não configurada — roteador de chaves de API desabilitado"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: NOT_CONFIGURED, message: "Roteador de APIs indisponível: API_VAULT_SECRET não configurada" }

  schemas:
    Error:
      type: object
      description: Formato padrão de erro.
      properties:
        code: { type: string, description: "Código estável legível por máquina" }
        message: { type: string, description: "Mensagem em português para humanos" }
      required: [code, message]

    SentryIssue:
      type: object
      description: Issue (grupo de eventos de erro) do Sentry, como devolvida por /sentry/issues.
      properties:
        id: { type: string }
        shortId: { type: string, description: "Ex.: API-GO-12" }
        title: { type: string }
        culprit: { type: string, description: "Função/rota onde o erro ocorreu" }
        level: { type: string, enum: [debug, info, warning, error, fatal] }
        status: { type: string, enum: [unresolved, resolved, ignored] }
        count: { type: string, description: "Total de eventos (string — o Sentry devolve como texto)" }
        userCount: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        permalink: { type: string, description: "Link direto pra issue no sentry.io" }
        project:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }

    SentryIssueDetail:
      description: SentryIssue + exceção/stacktrace do evento mais recente e tags, devolvida por /sentry/issues/{id}.
      allOf:
        - $ref: "#/components/schemas/SentryIssue"
        - type: object
          properties:
            exceptions:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, description: "Ex.: TypeError" }
                  value: { type: string, description: "Mensagem da exceção" }
                  frames:
                    type: array
                    description: "Do ponto do crash pro chamador raiz (mais recente primeiro)."
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        function: { type: string }
                        lineNo: { type: integer }
                        colNo: { type: integer }
                        contextLine: { type: string, description: "Linha de código no ponto do frame" }
                        inApp: { type: boolean, description: "Código do próprio serviço (não de dependência)" }
            tags:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }

    # ── payments-go schemas ────────────────────────────────────────────────
    Movement:
      type: object
      description: |
        Movimento financeiro do extrato: entrada (pagamento recebido) ou saída (saque).
        Derivado de cobranças pagas e saques registrados em payments-go.
      properties:
        id:
          type: integer
          format: int64
          description: ID da cobrança (direction=in) ou do saque (direction=out).
        type:
          type: string
          enum: [pix_in, boleto_in, card_in, fee, payout]
          description: >
            Tipo do movimento: `pix_in`/`boleto_in`/`card_in` para entradas por método;
            `fee` para taxas; `payout` para saques.
        direction:
          type: string
          enum: [in, out]
          description: "`in` = entrada de valor; `out` = saída de valor."
        method:
          type: string
          enum: [pix, boleto, card, ""]
          description: Método de pagamento (vazio para saques).
        valueCents:
          type: integer
          format: int64
          description: Valor em centavos (sempre positivo).
        customerName:
          type: string
          description: Nome do pagador (present only for entries).
        customerEmail:
          type: string
          description: Email do pagador (presente apenas em entradas).
        date:
          type: string
          format: date-time
          description: Data do movimento (paid_at para cobranças, created_at para saques).
      required: [id, type, direction, method, valueCents, date]

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, minLength: 8, format: password }
      required: [email, name, password]

    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Email ou username
        password: { type: string, format: password }
      required: [identifier, password]

    NewUser:
      type: object
      description: Usuário recém-criado (subset enxuto retornado no registro).
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, email, name, createdAt]

    UserProfile:
      type: object
      description: Perfil seguro do usuário (sem dados sensíveis).
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        username:
          type: [string, "null"]
        name: { type: string }
        role:
          type: integer
          description: "1=Student, 2=Teacher, 3=Admin, 4=Custom"
          enum: [1, 2, 3, 4]
        customRoleId:
          type: [string, "null"]
          description: ID do custom_role quando role=4
        avatarUrl:
          type: [string, "null"]
        mfaEnabled: { type: boolean }
        suspendedAt:
          type: [string, "null"]
          format: date-time
        permissions:
          type: [object, "null"]
          description: "Permissões resolvidas quando role=4 (mapa recurso → ações)."
          additionalProperties:
            type: array
            items: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, email, name, role, mfaEnabled, createdAt]

    SessionResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
        accessToken:
          type: string
          description: |
            Presente apenas quando o request não tem header `Origin` (cliente não-browser,
            ex. app mobile — navegadores sempre mandam `Origin` em POST). Fluxo web normal
            nunca recebe isto, só o cookie httpOnly.
        refreshToken:
          type: string
          description: Mesma condição de `accessToken`.
      required: [user]

    MfaChallengeResponse:
      type: object
      description: Devolvido pelo login quando o usuário tem MFA ativo.
      properties:
        mfaRequired: { type: boolean, const: true }
        challenge:
          type: string
          description: Token de uso único (10min) para o 2º passo do login.
      required: [mfaRequired, challenge]

    AccountSummary:
      type: object
      description: Visão de uma conta conhecida no cookie multi-conta deste navegador.
      properties:
        sessionId:
          type: string
          format: uuid
          description: ID da sessão (referência para activate/delete).
        name:
          type: string
          description: Nome do usuário.
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, "null"]
          description: URL do avatar no R2 (null se não configurado).
        active:
          type: boolean
          description: Verdadeiro se esta sessão corresponde ao `refresh_token` atual.
      required: [sessionId, name, email, avatarUrl, active]

    Model3DFile:
      type: object
      description: Modelo 3D salvo na biblioteca admin (R2 + Postgres).
      properties:
        id:
          type: integer
          format: int64
        filename:
          type: string
          description: Nome original do arquivo enviado.
        ext:
          type: string
          enum: [glb, gltf, stl, obj, fbx, blend]
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
          format: uri
          description: URL pública do objeto no R2.
        uploadedBy:
          type: integer
          description: ID do admin que enviou (ausente se a conta foi removida).
        createdAt:
          type: string
          format: date-time
        folder:
          type: string
          description: Pasta simples (1 nível) para organização — string livre, vazia se não estiver em nenhuma.
        pinned:
          type: boolean
          description: Favoritado — aparece no topo da lista.
        thumbnailUrl:
          type: string
          format: uri
          description: |
            Só presente para `.blend` salvo com "Save Preview Images" no Blender —
            miniatura estática (PNG) extraída do bloco TEST embutido no arquivo no
            momento do upload. Ausente para os demais formatos (que têm preview 3D
            real via `Model3DViewer`) e para `.blend` sem miniatura salva.
      required: [id, filename, ext, contentType, sizeBytes, url, createdAt, folder, pinned]
    AdminUser:
      type: object
      description: Usuário retornado nas rotas de gestão admin.
      properties:
        id:
          type: integer
          format: int64
          description: ID interno do usuário.
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: integer
          description: "1=Aluno, 2=Professor, 3=Admin."
          enum: [1, 2, 3]
        suspendedAt:
          type: [string, "null"]
          format: date-time
          description: Data de suspensão (null se ativa).
        createdAt:
          type: string
          format: date-time
        mfaEnabled:
          type: boolean
          description: Se o usuário tem MFA configurado.
        quotaBytes:
          type: integer
          format: int64
          description: Cota de armazenamento em bytes (0 = sem limite definido).
        pending:
          type: boolean
          description: Convite ainda não aceito (usuário não definiu senha).
        loginDisabled:
          type: boolean
          description: |
            true = caixa institucional compartilhada sem login. A conta não
            autentica por nenhum caminho (senha, OAuth, "esqueci a senha") e
            não recebe convite.
      required: [id, email, name, role, suspendedAt, createdAt, mfaEnabled, quotaBytes, pending, loginDisabled]

    OAuthClient:
      type: object
      description: Aplicação OAuth registrada ("Entrar com Santos Tech").
      properties:
        id:
          type: string
          format: uuid
          description: UUID interno (usado nas rotas PATCH/DELETE).
        clientId:
          type: string
          description: Identificador público da aplicação (passado em `/oauth/authorize`).
        name:
          type: string
          description: Nome exibido no chooser de contas.
        redirectUris:
          type: array
          items: { type: string, format: uri }
          description: Lista de redirect URIs autorizados.
        isActive:
          type: boolean
          description: Se falso, o fluxo de autorização é bloqueado para este client.
        createdAt:
          type: string
          format: date-time
      required: [id, clientId, name, redirectUris, isActive, createdAt]

    OAuthTokenResponse:
      type: object
      description: Resposta de tokens do endpoint `/oauth/token` (RFC 6749 §5.1).
      properties:
        access_token:
          type: string
          description: JWT HS256 de acesso (TTL 2h).
        refresh_token:
          type: string
          description: JWT HS256 de refresh (TTL 7d). Uso único — rotacionado a cada chamada.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Duração do access_token em segundos.
          example: 7200
      required: [access_token, refresh_token, token_type, expires_in]

    # ── Blog ────────────────────────────────────────────────────────────────
    BlogCategoryPublic:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
      required: [slug, name]

    BlogAuthorPublic:
      type: object
      properties:
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
      required: [name]

    BlogPostSummaryPublic:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImageUrl: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/BlogCategoryPublic" }
        author: { $ref: "#/components/schemas/BlogAuthorPublic" }
        publishedAt: { type: string, format: date-time }
      required: [slug, title, excerpt, category, author, publishedAt]

    BlogPostPublic:
      allOf:
        - $ref: "#/components/schemas/BlogPostSummaryPublic"
        - type: object
          properties:
            contentHtml: { type: string }
          required: [contentHtml]

    BlogCategory:
      type: object
      description: Categoria — view admin (com id).
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
      required: [id, slug, name]

    BlogCategoryInput:
      type: object
      properties:
        slug: { type: string, description: "Minúsculo, números e hífens (ex.: novidades)." }
        name: { type: string }
      required: [slug, name]

    BlogPost:
      type: object
      description: Post — view admin (todos os campos, qualquer status).
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        categoryId: { type: string, format: uuid }
        categorySlug: { type: string }
        categoryName: { type: string }
        authorId: { type: integer, format: int64, nullable: true }
        authorName: { type: string }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, slug, title, excerpt, contentHtml, categoryId, status, createdAt, updatedAt]

    BlogPostInput:
      type: object
      properties:
        slug: { type: string, description: "Minúsculo, números e hífens." }
        title: { type: string }
        excerpt: { type: string }
        contentHtml: { type: string, description: "HTML do corpo do post (editor rich text)." }
        coverImageUrl: { type: string, nullable: true, description: "URL devolvida por POST /auth/upload." }
        categoryId: { type: string, format: uuid }
        status: { type: string, enum: [draft, published], default: draft }
      required: [slug, title, categoryId]

    BlogMetricsOverview:
      type: object
      description: Resumo do período, com comparação vs período anterior de mesma duração.
      properties:
        pageviews: { type: integer, format: int64 }
        visitors: { type: integer, format: int64, description: "Visitantes únicos (dedup por visitorId)." }
        ctaClicks: { type: integer, format: int64 }
        conversionRate: { type: number, format: double, description: "ctaClicks / visitors." }
        prevPageviews: { type: integer, format: int64 }
        prevVisitors: { type: integer, format: int64 }
        prevCtaClicks: { type: integer, format: int64 }
        prevConversionRate: { type: number, format: double }
      required: [pageviews, visitors, ctaClicks, conversionRate, prevPageviews, prevVisitors, prevCtaClicks, prevConversionRate]

    BlogMetricsTimeseriesPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time, description: "Início do dia (ou hora, se from/to ≤ 24h)." }
        pageviews: { type: integer, format: int64 }
      required: [bucket, pageviews]

    BlogMetricsTopPost:
      type: object
      properties:
        postSlug: { type: string }
        title: { type: string, description: "Título do post (cai pro slug se o post foi apagado)." }
        views: { type: integer, format: int64 }
        ctaClicks: { type: integer, format: int64 }
        conversionRate: { type: number, format: double, description: "ctaClicks / views." }
      required: [postSlug, title, views, ctaClicks, conversionRate]

    BlogMetricsCount:
      type: object
      description: Contagem genérica por chave categórica (referrer, utm_source, device ou country).
      properties:
        key: { type: string }
        count: { type: integer, format: int64 }
      required: [key, count]

    BlogHeatmapClickBucket:
      type: object
      properties:
        xBucket: { type: integer }
        yBucket: { type: integer }
        count: { type: integer, format: int64 }
      required: [xBucket, yBucket, count]

    BlogHeatmapClickGrid:
      type: object
      description: |
        Grade de cliques já binada — nunca pontos crus. xBucket/yBucket são
        índices de grade; o admin converte pra posição real com
        (bucket+0.5)/cols (ou /rows) × largura/altura REAL do preview
        renderizado — nunca multiplicando por referenceWidth diretamente
        (que é só informativo).
      properties:
        referenceWidth: { type: integer, description: "Largura de referência do preview no admin (1024 desktop — o limiar do breakpoint lg:, 390 mobile). Informativo." }
        cols: { type: integer, description: "Número de colunas da grade (eixo X)." }
        rows: { type: integer, description: "Número de linhas da grade (eixo Y)." }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/BlogHeatmapClickBucket" }
      required: [referenceWidth, cols, rows, buckets]

    BlogHeatmapScrollDecile:
      type: object
      properties:
        decile: { type: number, format: double, description: "0.1 a 1.0 — profundidade do post." }
        reached: { type: integer, format: int64, description: "Sessões que chegaram até pelo menos esse decil." }
        total: { type: integer, format: int64, description: "Total de sessões no período." }
      required: [decile, reached, total]

    APIRouterProviderInput:
      type: object
      properties:
        name: { type: string, description: "Único; identifica o provider." }
        baseUrl: { type: string, example: "https://api.openai.com" }
        authHeader: { type: string, default: Authorization }
        authScheme: { type: string, default: Bearer, description: "Prefixo antes da chave no header; string vazia = sem prefixo." }
        unauthorizedCodes: { type: array, items: { type: integer }, default: [401], description: "Códigos que fazem o roteador marcar a chave unauthorized e tentar a próxima." }
        noCreditCodes: { type: array, items: { type: integer }, default: [402, 429], description: "Códigos que fazem o roteador marcar a chave no_credits e tentar a próxima." }
        testPath: { type: string, description: "Path usado pelo botão \"testar chave\"; vazio = raiz da baseUrl." }
        testMethod: { type: string, default: GET }
        chatAdapter: { type: string, enum: [openai_compatible, anthropic, google, cohere], default: openai_compatible, description: "Formato usado por POST .../chat pra montar a requisição nativa. openai_compatible cobre OpenAI, Mistral, DeepSeek, xAI/Grok." }
      required: [name, baseUrl]
    APIRouterProvider:
      allOf:
        - $ref: "#/components/schemas/APIRouterProviderInput"
        - type: object
          properties:
            id: { type: integer }
            keyCounts: { type: object, additionalProperties: { type: integer }, description: 'Contagem de chaves por status, ex. {"active":2,"unauthorized":1}.' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, keyCounts, createdAt, updatedAt]
    APIRouterKeyInput:
      type: object
      properties:
        label: { type: string, example: "conta principal" }
        secret: { type: string, description: "Valor real da chave — cifrado (AES-256-GCM) antes de persistir; nunca é reexibido." }
        priority: { type: integer, default: 0, description: "Menor valor = tentada primeiro." }
      required: [label, secret]
    APIRouterKey:
      type: object
      description: "Inclui o segredo decifrado (rota admin-only) — é o único ponto em que o valor cru sai do banco. `secret` vem vazio se a decifragem falhar."
      properties:
        id: { type: integer }
        providerId: { type: integer }
        label: { type: string }
        secretTail: { type: string, example: "7890" }
        secret: { type: string, description: "Valor real da chave, decifrado do AES-256-GCM.", example: "sk-1234567890abcdef7890" }
        status: { type: string, enum: [active, unauthorized, no_credits, disabled] }
        priority: { type: integer }
        failureCount: { type: integer }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }
        lastErrorCode: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, providerId, label, secretTail, status, priority, failureCount, createdAt, updatedAt]
    APIRouterTestResult:
      type: object
      properties:
        statusCode: { type: integer, description: "0 quando a requisição nem chegou a ter resposta (erro de rede/DNS)." }
        outcome: { type: string, enum: [success, unauthorized, no_credits, transport_error] }
        error: { type: string, description: "Mensagem de erro de transporte; vazio nos outros casos." }
      required: [statusCode, outcome]

# Por padrão, as rotas exigem o access_token (cookie ou Bearer).
# Rotas públicas sobrescrevem com `security: []`.
security:
  - cookieAuth: []
  - bearerAuth: []
