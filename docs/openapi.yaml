  /public/blog/categories:
    get:
      tags: [Blog]
      summary: Lista categorias (público)
      security: []
      responses:
        "200":
          description: Todas as categorias.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlogCategoryPublic" }
        "429":
          $ref: "#/components/responses/RateLimited"

  # ── Blog (admin) ────────────────────────────────────────────────────────
  /blog/posts:
    get:
      tags: [Blog]
      summary: Lista posts (admin — qualquer status)
      description: Requer `blog_posts:read`.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 12, maximum: 50 }
        - in: query
          name: status
          schema: { type: string, enum: [draft, published] }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Página de posts (todos os status).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BlogPost" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                required: [items, page, pageSize, total]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sem a permissão blog_posts:read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: FORBIDDEN, message: "Acesso restrito" }
    post:
      tags: [Blog]
      summary: Cria post (rascunho ou já publicado)
      description: "Requer `blog_posts:write`. `status: published` seta `publishedAt = now()`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostInput" }
      responses:
        "201":
          description: Post criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Já existe um post com esse slug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: SLUG_TAKEN, message: "Já existe um post com esse slug" }

  /blog/posts/{id}:
    get:
      tags: [Blog]
      summary: Busca post por id (admin)
      description: Requer `blog_posts:read`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Post.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "404":
          description: Post não encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: BLOG_POST_NOT_FOUND, message: "Post não encontrado" }
    patch:
      tags: [Blog]
      summary: Atualiza post (inclui publicar/despublicar via status)
      description: Requer `blog_posts:write`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostInput" }
      responses:
        "200":
          description: Post atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Post não encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Já existe um post com esse slug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Blog]
      summary: Apaga post (destrutivo)
      description: Admin-only + sudo mode (não passa pelo sistema de permissão de cargo).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Apagado.
        "403":
          description: Requer role Admin + sudo mode recente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Post não encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

