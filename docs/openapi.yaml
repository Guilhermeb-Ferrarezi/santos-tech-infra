          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 12, maximum: 50 }
        - in: query
          name: category
          schema: { type: string }
          description: Slug da categoria pra filtrar.
        - in: query
          name: q
