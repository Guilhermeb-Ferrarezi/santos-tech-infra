  /analytics/overview:
    get:
      tags: [Observabilidade]
      summary: Totais de pageviews/visitantes (período atual e anterior) via PostHog
      description: |
        Admin-only. Consulta a Query API (HogQL) da PostHog dos eventos `$pageview`
