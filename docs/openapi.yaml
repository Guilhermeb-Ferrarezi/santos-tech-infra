  # ── Blog Analytics ───────────────────────────────────────────────────────
  /public/blog/events:
    post:
      tags: [Blog Analytics]
      summary: Registra um evento de analytics do blog (beacon anônimo)
      description: Sem autenticação. device/browser/os/country são sempre derivados no servidor (User-Agent, CF-IPCountry) — nunca aceitos do payload.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, path, sessionId, visitorId]
              properties:
                type: { type: string, enum: [pageview, cta_click] }
                path: { type: string }
                postSlug: { type: string, nullable: true }
                sessionId: { type: string }
                visitorId: { type: string }
                referrer: { type: string }
                utmSource: { type: string }
      responses:
        "204":
          description: Evento registrado.
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/blog/heatmap/events:
    post:
      tags: [Blog Analytics]
      summary: Registra um lote de heatmap (cliques + profundidade de scroll)
      description: |
        Sem autenticação. Sempre um LOTE por flush do client (ver
        blog/web/src/lib/blog-heatmap.ts) — nunca 1 request por clique. Até
        200 cliques por lote; maxScrollDepthPct é opcional (1 valor por
        pageview, a profundidade máxima já alcançada até aquele flush).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postSlug, viewport, sessionId]
              properties:
                postSlug: { type: string }
                viewport: { type: string, enum: [mobile, desktop] }
                sessionId: { type: string }
                clicks:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [xPct, yPct]
                    properties:
                      xPct: { type: number, format: double, minimum: 0, maximum: 1, description: "Relativo à largura do conteúdo (0..1)." }
                      yPct: { type: number, format: double, minimum: 0, maximum: 1, description: "Relativo à altura do conteúdo (0..1) — mesma normalização de xPct, resolução-independente." }
                maxScrollDepthPct: { type: number, format: double, minimum: 0, maximum: 1, nullable: true }
      responses:
        "204":
          description: Lote registrado.
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /blog/metrics/overview:
    get:
      tags: [Blog Analytics]
      summary: Resumo de pageviews/visitantes/cliques CTA, com comparação vs período anterior
      description: Requer `blog_posts:read`.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - { in: query, name: postSlug, schema: { type: string } }
        - { in: query, name: referrer, description: "Drill-down: filtra pelo domínio de referrer clicado no painel.", schema: { type: string } }
        - { in: query, name: utmSource, description: "Drill-down: filtra pelo utm_source clicado no painel.", schema: { type: string } }
        - { in: query, name: device, description: "Drill-down: filtra pelo dispositivo clicado no painel.", schema: { type: string } }
        - { in: query, name: country, description: "Drill-down: filtra pelo país (ISO alpha-2) clicado no painel.", schema: { type: string } }
      responses:
        "200":
          description: Resumo do período.
