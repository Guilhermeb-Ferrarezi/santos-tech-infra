version: 2
updates:
  # bun: o Dependabot lê o bun.lock da raiz (suporte GA desde 2025). NÃO use "npm"
  # aqui — esse ecossistema ignora bun.lock e não geraria nenhum PR neste monorepo.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      jose:
        patterns:
          - "jose"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
  - package-ecosystem: gomod
    directory: /apps/api-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /apps/agent-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /apps/bot-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /apps/payments-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /apps/mcp-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /apps/auto-fixer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
