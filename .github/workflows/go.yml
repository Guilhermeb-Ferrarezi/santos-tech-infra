name: go
on:
  push:
    paths:
      - "apps/api-go/**"
      - "apps/agent-go/**"
      - "apps/bot-go/**"
      - "apps/payments-go/**"
      - "apps/mcp-go/**"
      - "apps/auto-fixer/**"
      - "apps/cron-go/**"
      - "apps/secrets-go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "apps/api-go/**"
      - "apps/agent-go/**"
      - "apps/bot-go/**"
      - "apps/payments-go/**"
      - "apps/mcp-go/**"
      - "apps/auto-fixer/**"
      - "apps/cron-go/**"
      - "apps/secrets-go/**"
      - ".github/workflows/go.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-go
          - agent-go
          - bot-go
          - payments-go
          - mcp-go
          - auto-fixer
          - cron-go
          - secrets-go
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/${{ matrix.service }}/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Arquivos não formatados (rode gofmt -w .):"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      # govulncheck cruza o código com a base de vulnerabilidades da Go (só
      # reporta CVE cujo símbolo é realmente alcançável a partir daqui, então
      # tem pouco ruído). Entra como NÃO-BLOQUEANTE de propósito: primeiro se
      # vê o passivo de cada serviço sem travar o pipeline; depois de zerar,
      # remova o continue-on-error pra virar gate de verdade.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
