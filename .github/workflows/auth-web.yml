name: auth-web
on:
  push: { branches: [master], paths: ["apps/auth-web/**", ".github/workflows/auth-web.yml"] }
  pull_request: { paths: ["apps/auth-web/**", ".github/workflows/auth-web.yml"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/auth-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
